# Security headers for /silent-callback.html only, for an app whose origins
# are fixed at build time. Source: con-services
# shared/nginx/security-headers-frame-self.conf.
# Docs: https://aglelectronics.github.io/con-services/concepts/shared-code/#silent-sign-in-iframe
#
# Prefer security-headers-frame-self.conf.template. This file is the same
# headers with placeholders you replace by hand, matching
# security-headers.conf except frame-ancestors 'self' and
# X-Frame-Options SAMEORIGIN.
#
# Include it only here:
#
#   location = /silent-callback.html {
#       include /etc/nginx/snippets/security-headers-frame-self.conf;
#       add_header Cache-Control "no-cache" always;
#   }
#
# Replace the same placeholders as security-headers.conf (or remove the
# ones the app does not need): KEYCLOAK_ORIGIN, DEN_ORIGIN, S3_ORIGIN,
# EXTRA_FRAME_SRC.

# Same policy as security-headers.conf. This one page may be framed by the
# app itself; forms still post only to itself or Keycloak.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: S3_ORIGIN; font-src 'self' data:; connect-src 'self' KEYCLOAK_ORIGIN DEN_ORIGIN S3_ORIGIN; frame-src 'self' EXTRA_FRAME_SRC KEYCLOAK_ORIGIN; frame-ancestors 'self'; form-action 'self' KEYCLOAK_ORIGIN; base-uri 'self'; object-src 'none'" always;

# Older browsers that do not know frame-ancestors. SAMEORIGIN, not DENY.
add_header X-Frame-Options "SAMEORIGIN" always;

# Never guess a content type from the bytes.
add_header X-Content-Type-Options "nosniff" always;

# Send only the origin to other sites, nothing over plain HTTP.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Browser features. Stash's copy uses camera=(self); see the main file.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
