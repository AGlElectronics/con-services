# Builds the runner image for the self-hosted ARC runners
# (infra/ci-runner/Dockerfile) and publishes it as
# ghcr.io/aglelectronics/ci-runner:<tag from infra/ci-runner/VERSION>.
# Runs on GitHub-hosted runners: this repository is public, and the
# self-hosted runners cannot build their own image before they exist.
# Docs: https://aglelectronics.github.io/con-services/contributing/ci/#where-it-runs
name: CI runner image

on:
  pull_request:
    paths:
      - "infra/ci-runner/**"
      - ".github/workflows/ci-runner-image.yml"
  push:
    branches: [main]
    paths:
      - "infra/ci-runner/**"
      - ".github/workflows/ci-runner-image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/aglelectronics/ci-runner
  TRIVY_VERSION: v0.76.2

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the tag
        id: tag
        run: |
          tag="$(tr -d '[:space:]' < infra/ci-runner/VERSION)"
          [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]] || { echo "::error::VERSION must be RUNNER_VERSION-BUILD, got '$tag'"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build linux/amd64 to an OCI archive
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: infra/ci-runner
          platforms: linux/amd64
          pull: true
          provenance: false
          sbom: false
          outputs: type=oci,dest=${{ runner.temp }}/image.tar

      - name: Unpack the OCI layout (Trivy reads a directory)
        run: mkdir -p "$RUNNER_TEMP/image-oci" && tar -xf "$RUNNER_TEMP/image.tar" -C "$RUNNER_TEMP/image-oci"

      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true

      - name: Trivy scan (SARIF)
        id: sarif
        run: trivy image --quiet --input "$RUNNER_TEMP/image-oci" --ignore-unfixed --format sarif --output "$RUNNER_TEMP/trivy.sarif"

      - name: Upload SARIF
        if: always() && steps.sarif.outcome == 'success'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ runner.temp }}/trivy.sarif
          category: trivy-ci-runner

      # Build tool, never deployed with the suite: gated on CRITICAL only
      # (the upstream runner bundles Node.js and .NET, which often carry HIGH
      # findings until the next runner release).
      - name: Gate on CRITICAL vulnerabilities
        run: trivy image --quiet --input "$RUNNER_TEMP/image-oci" --ignore-unfixed --severity CRITICAL --exit-code 1 --format table

      - uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7
        if: github.event_name != 'pull_request'
        with:
          version: v0.22.1

      - name: Refuse to overwrite an existing tag
        if: github.event_name != 'pull_request'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if crane digest "$IMAGE:$TAG" >/dev/null 2>&1; then
            echo "::error::$IMAGE:$TAG already exists. Raise the BUILD number in infra/ci-runner/VERSION."
            exit 1
          fi

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: infra/ci-runner
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tag.outputs.tag }}
          provenance: mode=max
          sbom: true
          push: true

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: github.event_name != 'pull_request'

      - name: Sign (keyless)
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
