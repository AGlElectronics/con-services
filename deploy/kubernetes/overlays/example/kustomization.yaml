# Example overlay: the platform (Keycloak, PostgreSQL, S3, Den) on a
# local kind cluster with Cilium at https://*.conservices.test.
#
# DEV / QUICKSTART ONLY. secrets.yaml holds PUBLIC dev values as plain
# Kubernetes Secrets, and the in-cluster SeaweedFS is a local-trial
# stand-in for a managed S3 service. For
# anything else, use the production path (docs: deploy/).
#
# Needs: Cilium with the Gateway API enabled (GatewayClass "cilium"),
# cert-manager and trust-manager. Before the first `kubectl apply -k`, fill
# the local/ folder (gitignored); see docs: getting-started/den-quickstart.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - gateway.yaml
  - secrets.yaml

# Pin exact versions. All images of one module share one tag.
images:
  - name: ghcr.io/aglelectronics/den-backend
    newTag: 1.0.0-1
  - name: ghcr.io/aglelectronics/den-frontend
    newTag: 1.0.0-1
  - name: ghcr.io/aglelectronics/den-operator
    newTag: 1.0.0-1

patches:
  - path: den-backend-local.yaml
  - path: keycloak-local.yaml
  # Local trial only: also route Keycloak's admin console (/admin/) through
  # the Gateway. Production keeps it off the public address.
  - target:
      kind: HTTPRoute
      name: keycloak
    patch: |-
      - op: add
        path: /spec/rules/0/matches/-
        value:
          path:
            type: PathPrefix
            value: /admin/

configMapGenerator:
  - name: den-operator-config
    namespace: conservices-den
    behavior: merge
    literals:
      # DEV ONLY key pair: the secret half is infra/operator/dev-backup-identity.txt.
      - BACKUP_AGE_RECIPIENTS=age1777a9j365d2nmjl24nvp45jz8ww9sg4xv9n4h84rl4nay9xww39sc5t73k
      # Add wiki-data once Wiki is installed (its page bodies exist only there).
      - FILES_S3_BUCKETS=den-data,stash-data
  # Copied from infra/keycloak/ into local/ (kustomize only reads files
  # inside this folder).
  - name: keycloak-realm
    namespace: conservices-identity
    files:
      - realm-conservices.json=local/realm-conservices.json
  - name: keycloak-theme
    namespace: conservices-identity
    files:
      - login-theme.properties=local/theme/login/theme.properties
      - login-footer.ftl=local/theme/login/footer.ftl
      - login-conservices.css=local/theme/login/resources/css/conservices.css
      - login-brand.js=local/theme/login/resources/js/brand.js
      - email-theme.properties=local/theme/email/theme.properties
      - email-messages_en.properties=local/theme/email/messages/messages_en.properties

secretGenerator:
  # Local certificate made with mkcert (local/tls.crt, local/tls.key) for
  # *.conservices.test, held by the Gateway in its own namespace. No hash
  # suffix: Kustomize does not rewrite Gateway certificateRefs.
  - name: conservices-tls
    namespace: conservices-gateway
    type: kubernetes.io/tls
    options:
      disableNameSuffixHash: true
    files:
      - tls.crt=local/tls.crt
      - tls.key=local/tls.key
  # mkcert's root certificate (public), trusted by Den next to the internal CA.
  - name: local-ca
    namespace: conservices-den
    files:
      - conservices-local-ca.pem=local/rootCA.pem
