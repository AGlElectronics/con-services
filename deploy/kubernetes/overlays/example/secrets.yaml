# DEV / QUICKSTART ONLY: plain Kubernetes Secrets with PUBLIC values.
# Anything beyond a local trial gets its secrets from a secret manager:
# replace this one file with an ExternalSecret file, as shown in
# overlays/production-external-secrets/external-secrets.yaml.
# Docs: operations/secrets.
#
# Values that must match each other are marked (same value in two places).
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: conservices-data
type: Opaque
stringData:
  POSTGRES_PASSWORD: postgres-dev-password # = password in PG_ADMIN_URL
  DEN_DB_PASSWORD: den-dev-password # = password in den DATABASE_URL
  KEYCLOAK_DB_PASSWORD: keycloak-dev-password # = KC_DB_PASSWORD
---
apiVersion: v1
kind: Secret
metadata:
  name: s3-secrets
  namespace: conservices-data
type: Opaque
stringData:
  # The S3 key of the in-cluster S3 server (= the S3_*/BACKUP_S3_*/FILES_S3_*
  # keys below and in the module overlays).
  AWS_ACCESS_KEY_ID: conservices
  AWS_SECRET_ACCESS_KEY: conservicesdev
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secrets
  namespace: conservices-identity
type: Opaque
stringData:
  KC_DB_PASSWORD: keycloak-dev-password
  KC_BOOTSTRAP_ADMIN_USERNAME: admin
  KC_BOOTSTRAP_ADMIN_PASSWORD: admin
---
apiVersion: v1
kind: Secret
metadata:
  name: den-secrets
  namespace: conservices-den
type: Opaque
stringData:
  DATABASE_URL: postgres://den:den-dev-password@postgres.conservices-data.svc.cluster.local:5432/den?sslmode=verify-full&sslrootcert=/etc/conservices-internal-ca/ca.crt
  S3_ACCESS_KEY_ID: conservices
  S3_SECRET_ACCESS_KEY: conservicesdev
  # = secret of the den-keycloak client in infra/keycloak/realm-conservices.json
  KEYCLOAK_CLIENT_SECRET: den-keycloak-dev-secret
  OPERATOR_TOKEN: den-operator-dev-token # = OPERATOR_TOKEN below
  # DEV ONLY. Derives module credentials so Den can fetch portal to-dos.
  DEN_CREDENTIAL_KEY: dev-only-den-credential-key-change-me
  # DEV ONLY. Shared SMTP password for paired modules. Mailpit needs no
  # login, so this stays empty. Production: set it in the secret manager.
  DEN_SMTP_PASSWORD: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: den-operator-secrets
  namespace: conservices-den
type: Opaque
stringData:
  OPERATOR_TOKEN: den-operator-dev-token
  PG_ADMIN_URL: postgres://postgres:postgres-dev-password@postgres.conservices-data.svc.cluster.local:5432/postgres?sslmode=verify-full&sslrootcert=/etc/conservices-internal-ca/ca.crt
  BACKUP_S3_ACCESS_KEY_ID: conservices
  BACKUP_S3_SECRET_ACCESS_KEY: conservicesdev
  FILES_S3_ACCESS_KEY_ID: conservices
  FILES_S3_SECRET_ACCESS_KEY: conservicesdev
