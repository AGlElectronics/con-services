# LOCAL CLUSTER ONLY. Den checks sign-in tokens against the public issuer
# URL https://auth.conservices.test, which pods cannot resolve on a laptop.
#   - hostAliases points that name at the Service keycloak-public, whose
#     address keycloak-local.yaml fixes at 10.96.0.100. Keycloak's internal
#     certificate carries auth.conservices.test, so the internal CA (already
#     trusted) is enough.
#   - SSL_CERT_DIR adds mkcert's root certificate to the trusted ones, next
#     to the internal CA the base already trusts.
# Production clusters resolve the name with a CoreDNS rewrite instead; delete
# this patch there.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: den-backend
  namespace: conservices-den
spec:
  template:
    spec:
      hostAliases:
        - ip: "10.96.0.100" # keycloak-public, see keycloak-local.yaml
          hostnames:
            - auth.conservices.test
      containers:
        - name: backend
          env:
            - name: SSL_CERT_DIR
              value: /etc/conservices-internal-ca:/etc/conservices-ca
          volumeMounts:
            - name: local-ca
              mountPath: /etc/conservices-ca
              readOnly: true
      volumes:
        - name: local-ca
          secret:
            secretName: local-ca
