# LOCAL CLUSTER ONLY; same reason as overlays/example/den-backend-local.yaml:
# auth.conservices.test -> keycloak-public (fixed at 10.96.0.100 by
# overlays/example/keycloak-local.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stash-backend
  namespace: conservices-stash
spec:
  template:
    spec:
      hostAliases:
        - ip: "10.96.0.100" # keycloak-public
          hostnames:
            - auth.conservices.test
      containers:
        - name: backend
          env:
            - name: SSL_CERT_DIR
              value: /etc/conservices-internal-ca:/etc/conservices-ca
          volumeMounts:
            - name: local-ca
              mountPath: /etc/conservices-ca
              readOnly: true
      volumes:
        - name: local-ca
          secret:
            secretName: local-ca
