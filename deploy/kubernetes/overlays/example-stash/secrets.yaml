# DEV / QUICKSTART ONLY: plain Secret. Production: an ExternalSecret with
# the same name (see overlays/production-external-secrets). Docs: operations/secrets.
apiVersion: v1
kind: Secret
metadata:
  name: stash-secrets
  namespace: conservices-stash
type: Opaque
stringData:
  # Paste the URL Den shows once when it creates Stash's database.
  DATABASE_URL: postgres://stash:PASTE-THE-PASSWORD-FROM-DEN@postgres.conservices-data.svc.cluster.local:5432/stash?sslmode=verify-full&sslrootcert=/etc/conservices-internal-ca/ca.crt
  # Local S3 server keys (= s3-secrets in overlays/example). Production: keys that can only reach the stash bucket.
  S3_ACCESS_KEY_ID: conservices
  S3_SECRET_ACCESS_KEY: conservicesdev
  # DEV ONLY, public value: encrypts the Den credential Stash stores (read by
  # Stash releases that use the shared denlink). Production: one random key
  # per module (openssl rand -base64 32) from your secret manager.
  DEN_LINK_ENCRYPTION_KEY: ZGV2LW9ubHktc3Rhc2gtZGVuLWxpbmsta2V5LTAwMDA=
