# Example overlay for Stash, applied AFTER overlays/example once Den is up.
#
# Before applying:
#   1. Den -> Admin console -> Modules -> New module (slug "stash", tick
#      "Create a database for it") and paste the database URL Den shows
#      into DATABASE_URL in secrets.yaml.
#   2. Fill local/ (gitignored): tls.crt, tls.key, rootCA.pem (same files as
#      the platform overlay) and access-config.toml from stash/infra/.
#   3. Set the ingress controller IP in stash-backend-local.yaml.
# DEV / QUICKSTART ONLY: secrets.yaml is a plain Secret with dev values.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../modules/stash
  - secrets.yaml

images:
  - name: ghcr.io/aglelectronics/stash-backend
    newTag: 1.0.0-1
  - name: ghcr.io/aglelectronics/stash-frontend
    newTag: 1.0.0-1

patches:
  - path: stash-backend-local.yaml

configMapGenerator:
  - name: stash-access-config
    namespace: conservices-stash
    files:
      - access-config.toml=local/access-config.toml

secretGenerator:
  - name: conservices-tls
    namespace: conservices-stash
    type: kubernetes.io/tls
    files:
      - tls.crt=local/tls.crt
      - tls.key=local/tls.key
  - name: local-ca
    namespace: conservices-stash
    files:
      - conservices-local-ca.pem=local/rootCA.pem
