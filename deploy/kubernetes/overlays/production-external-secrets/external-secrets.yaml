# Secrets from a secret manager through the External Secrets Operator (ESO,
# https://external-secrets.io), here backed by HashiCorp Vault or OpenBao.
# This file replaces overlays/example/secrets.yaml: every ExternalSecret
# writes a Kubernetes Secret with the same name and keys the base expects.
#
# Least privilege: one SecretStore per namespace, each logging in to Vault
# with its own Kubernetes service account and Vault role, so a namespace
# can only read its own secrets. Vault layout (KV v2, mount "secret"):
#   secret/conservices/data/postgres   POSTGRES_PASSWORD DEN_DB_PASSWORD KEYCLOAK_DB_PASSWORD
#   secret/conservices/data/minio      MINIO_ROOT_USER MINIO_ROOT_PASSWORD
#   secret/conservices/identity/keycloak  KC_DB_PASSWORD KC_BOOTSTRAP_ADMIN_USERNAME KC_BOOTSTRAP_ADMIN_PASSWORD
#   secret/conservices/den/backend     DATABASE_URL S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY KEYCLOAK_CLIENT_SECRET OPERATOR_TOKEN
#   secret/conservices/den/operator    OPERATOR_TOKEN PG_ADMIN_URL BACKUP_S3_* FILES_S3_*
# For AWS Secrets Manager, Azure Key Vault or Google Secret Manager only the
# SecretStore "provider" block changes; see docs: operations/secrets.
# --- conservices-data --------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets
  namespace: conservices-data
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
  namespace: conservices-data
spec:
  provider:
    vault:
      server: https://vault.example.org
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: conservices-data
          serviceAccountRef:
            name: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-secrets
  namespace: conservices-data
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: postgres-secrets
  dataFrom:
    - extract:
        key: conservices/data/postgres
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-secrets
  namespace: conservices-data
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: minio-secrets
  dataFrom:
    - extract:
        key: conservices/data/minio
