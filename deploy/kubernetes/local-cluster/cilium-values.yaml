# LOCAL TRIAL ONLY. Cilium 1.20.4 on the kind cluster from kind-config.yaml.
# Production values: con-services-gitops/bootstrap/cilium/values.yaml
# (docs: deploy/cluster).
#
#   helm install cilium cilium/cilium --version 1.20.4 -n kube-system \
#     -f deploy/kubernetes/local-cluster/cilium-values.yaml
#
# Install the Gateway API CRDs first: Cilium only enables its Gateway API
# controller when they exist at start.

# Replace kube-proxy (kind-config.yaml turns it off). Cilium then needs the
# API server address directly: the kind node's name and port.
kubeProxyReplacement: true
k8sServiceHost: conservices-control-plane
k8sServicePort: 6443

ipam:
  mode: kubernetes

# Gateway API controller (needs kubeProxyReplacement and the L7 proxy).
gatewayAPI:
  enabled: true
  # A laptop has no load balancer: Envoy listens directly on ports 80 and
  # 443 of the node, which kind-config.yaml publishes on 127.0.0.1.
  hostNetwork:
    enabled: true

# Ports below 1024 need NET_BIND_SERVICE for the Envoy process.
envoy:
  securityContext:
    capabilities:
      envoy:
        - NET_ADMIN
        - SYS_ADMIN
        - NET_BIND_SERVICE
      keepCapNetBindService: true

operator:
  replicas: 1

# Hubble shows allowed and dropped connections (docs: operations/network-policies).
hubble:
  relay:
    enabled: true
