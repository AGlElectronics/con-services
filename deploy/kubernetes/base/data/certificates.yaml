# Server certificates for the in-cluster data services, signed by the
# internal CA (../pki). cert-manager renews them 30 days before they expire.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: postgres-tls
  namespace: conservices-data
spec:
  secretName: postgres-tls
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    encoding: PKCS8
    rotationPolicy: Always
  usages: ["server auth", "digital signature"]
  dnsNames:
    - postgres
    - postgres.conservices-data
    - postgres.conservices-data.svc
    - postgres.conservices-data.svc.cluster.local
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: conservices-internal-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: s3-tls
  namespace: conservices-data
spec:
  secretName: s3-tls
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    encoding: PKCS8
    rotationPolicy: Always
  usages: ["server auth", "digital signature"]
  dnsNames:
    - s3
    - s3.conservices-data
    - s3.conservices-data.svc
    - s3.conservices-data.svc.cluster.local
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: conservices-internal-ca
