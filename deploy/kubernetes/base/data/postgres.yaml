# One PostgreSQL 16 server, one database and login per component.
# Keep the major version in step with the den-operator image (pg_dump 16).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres
  namespace: conservices-data
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: conservices-data
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: database
    spec:
      serviceAccountName: postgres
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # uid/gid of the postgres user in the alpine image
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          # TLS with the certificate from certificates.yaml; pg_hba.conf
          # refuses connections over the network that do not use it.
          args:
            - postgres
            - -c
            - ssl=on
            - -c
            - ssl_cert_file=/etc/conservices-tls/tls.crt
            - -c
            - ssl_key_file=/etc/conservices-tls/tls.key
            - -c
            - ssl_min_protocol_version=TLSv1.2
            - -c
            - hba_file=/etc/postgresql/pg_hba.conf
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          envFrom:
            - secretRef:
                name: postgres-secrets
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: run
              mountPath: /var/run/postgresql
            - name: tls
              mountPath: /etc/conservices-tls
              readOnly: true
            - name: hba
              mountPath: /etc/postgresql
              readOnly: true
        # PostgreSQL reads its certificate only at start and on reload. This
        # sidecar reloads it through the local socket whenever cert-manager
        # has renewed the certificate.
        - name: tls-reload
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              last=""
              while true; do
                now=$(cat /etc/conservices-tls/tls.crt /etc/conservices-tls/tls.key | sha256sum)
                if [ "$now" != "$last" ]; then
                  if [ -z "$last" ] || psql -h /var/run/postgresql -U postgres -d postgres -tAc 'SELECT pg_reload_conf()' >/dev/null; then
                    [ -n "$last" ] && echo "reloaded the renewed TLS certificate"
                    last=$now
                  fi
                fi
                sleep 300
              done
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: run
              mountPath: /var/run/postgresql
            - name: tls
              mountPath: /etc/conservices-tls
              readOnly: true
      volumes:
        - name: init
          configMap:
            name: postgres-init
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        # Owned by root and group 70 (fsGroup), mode 0640: the only
        # combination PostgreSQL accepts for a key file it does not own.
        - name: tls
          secret:
            secretName: postgres-tls
            defaultMode: 0640
        - name: hba
          configMap:
            name: postgres-hba
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: conservices-data
  labels:
    app.kubernetes.io/name: postgres
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
