# Simple in-cluster data services so a local cluster works out of the box.
# Production: use a managed PostgreSQL or CloudNativePG, and real S3-compatible
# storage instead of MinIO (MinIO here is DEV ONLY, see Den ADR 0003).
# To use external services, drop "data" from ../kustomization.yaml and point
# the connection settings of Den, Keycloak and the modules at them.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - postgres.yaml
  - minio.yaml
  - networkpolicies.yaml

configMapGenerator:
  - name: postgres-init
    namespace: conservices-data
    files:
      - 01-platform-databases.sh=postgres-init.sh

# Secrets come from the overlay (plain Secrets in overlays/example, External
# Secrets in overlays/production-external-secrets):
#   postgres-secrets: POSTGRES_PASSWORD (superuser, only the Den operator
#                     gets it), DEN_DB_PASSWORD, KEYCLOAK_DB_PASSWORD
#   minio-secrets:    MINIO_ROOT_USER, MINIO_ROOT_PASSWORD
