# Replaces the Caddy block "auth.conservices.test { reverse_proxy keycloak:8080 }".
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  namespace: conservices-identity
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffer-size: 16k
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - auth.conservices.test
      secretName: conservices-tls
  rules:
    - host: auth.conservices.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  name: http
