apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - keycloak.yaml
  - ingress.yaml
  - networkpolicies.yaml

configMapGenerator:
  - name: keycloak-config
    namespace: conservices-identity
    literals:
      # Public URL baked into every token (the "issuer"). Must match what
      # browsers use and what backends put in OIDC_ISSUER_URL.
      - KC_HOSTNAME=https://auth.conservices.test
      - KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true
      - KC_HTTP_ENABLED=true
      - KC_PROXY_HEADERS=xforwarded
      - KC_HEALTH_ENABLED=true
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres.conservices-data.svc.cluster.local:5432/keycloak
      - KC_DB_USERNAME=keycloak

# Secret "keycloak-secrets" (KC_DB_PASSWORD, KC_BOOTSTRAP_ADMIN_USERNAME,
# KC_BOOTSTRAP_ADMIN_PASSWORD) comes from the overlay: plain Secrets in
# overlays/example, External Secrets in overlays/production-external-secrets.
