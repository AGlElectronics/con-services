apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - certificate.yaml
  - keycloak.yaml
  - route.yaml
  - networkpolicies.yaml

configMapGenerator:
  - name: keycloak-config
    namespace: conservices-identity
    literals:
      # Public URL baked into every token (the "issuer"). Must match what
      # browsers use and what backends put in OIDC_ISSUER_URL.
      - KC_HOSTNAME=https://auth.conservices.test
      - KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true
      # HTTPS only, on 8443, with the certificate from certificate.yaml.
      # Keycloak re-reads the files every hour, so renewals need no restart.
      - KC_HTTP_ENABLED=false
      - KC_HTTPS_PORT=8443
      - KC_HTTPS_CERTIFICATE_FILE=/etc/conservices-tls/tls.crt
      - KC_HTTPS_CERTIFICATE_KEY_FILE=/etc/conservices-tls/tls.key
      - KC_PROXY_HEADERS=xforwarded
      - KC_HEALTH_ENABLED=true
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres.conservices-data.svc.cluster.local:5432/keycloak?sslmode=verify-full&sslrootcert=/etc/conservices-internal-ca/ca.crt
      - KC_DB_USERNAME=keycloak
      # Den's public address: the conservices login theme fetches the brand
      # from there in the browser (no cluster connection is needed).
      - DEN_PUBLIC_URL=https://den.conservices.test

# Secret "keycloak-secrets" (KC_DB_PASSWORD, KC_BOOTSTRAP_ADMIN_USERNAME,
# KC_BOOTSTRAP_ADMIN_PASSWORD) comes from the overlay: plain Secrets in
# overlays/example, External Secrets in overlays/production-external-secrets.
