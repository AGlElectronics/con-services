# conservices-identity: deny everything, then allow
#   Cilium gateway     -> keycloak:8443   (browsers; CiliumNetworkPolicy at the end)
#   den-backend        -> keycloak:8443   (OIDC discovery and keys through
#                                          keycloak-public, Keycloak admin API)
#   module backends    -> keycloak:8443   (OIDC discovery and keys through
#                                          keycloak-public; HR and Learn also
#                                          use the admin API)
#   keycloak           -> postgres:5432   (its own database)
#   keycloak           -> DNS
# All of these use TLS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: conservices-identity
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: conservices-identity
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak
  namespace: conservices-identity
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: conservices-den
          podSelector:
            matchLabels:
              app.kubernetes.io/name: den
              app.kubernetes.io/component: backend
        - namespaceSelector:
            matchLabels:
              conservices.io/tier: module
          podSelector:
            matchLabels:
              app.kubernetes.io/component: backend
      ports:
        - protocol: TCP
          port: 8443
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: conservices-data
          podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - protocol: TCP
          port: 5432
---
# Cilium Gateway API: the gateway's Envoy reaches Keycloak with Cilium's
# reserved identity "ingress", which a Kubernetes NetworkPolicy cannot select.
# Needs Cilium's CRDs. Other CNIs and gateways: delete this object and add an
# ingress rule for your gateway's namespace to the keycloak policy above.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: keycloak-from-gateway
  namespace: conservices-identity
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  ingress:
    - fromEntities: ["ingress"]
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
