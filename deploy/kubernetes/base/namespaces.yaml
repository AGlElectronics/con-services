# One namespace per concern. Every namespace enforces the Pod Security
# Standard "restricted" and starts from default-deny NetworkPolicies.
# Module namespaces (see ../modules/) carry conservices.io/tier: module.
apiVersion: v1
kind: Namespace
metadata:
  name: conservices-identity
  labels:
    app.kubernetes.io/part-of: conservices
    conservices.io/tier: platform
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: conservices-data
  labels:
    app.kubernetes.io/part-of: conservices
    conservices.io/tier: data
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: conservices-den
  labels:
    app.kubernetes.io/part-of: conservices
    conservices.io/tier: platform
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
