# conservices-den: deny everything, then allow
#   Cilium gateway     -> den-frontend:8080  (CiliumNetworkPolicy at the end)
#   den-frontend       -> den-backend:8080
#   module backends    -> den-backend:8080   (pairing, bundle, preferences)
#   den-backend        -> postgres:5432, s3:9000, den-operator:8080,
#                         keycloak:8443 (admin API, and OIDC discovery and
#                         keys: auth.<domain> resolves to keycloak-public),
#                         module backends:8080 (portal to-dos, role catalogs)
#   den-operator       -> postgres:5432, s3:9000
#   everything         -> DNS
# Every connection except DNS uses TLS (internal CA, ../pki).
# Same rules as the Den Helm chart, except the data selectors (this base runs
# the in-cluster postgres and s3 pods).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: conservices-den
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: conservices-den
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: den-frontend
  namespace: conservices-den
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: den
      app.kubernetes.io/component: frontend
  policyTypes: ["Ingress", "Egress"]
  # Cilium's gateway is admitted by the CiliumNetworkPolicy den-web-from-gateway.
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: den
              app.kubernetes.io/component: backend
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: den-backend
  namespace: conservices-den
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: den
      app.kubernetes.io/component: backend
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: den
              app.kubernetes.io/component: frontend
        - namespaceSelector:
            matchLabels:
              conservices.io/tier: module
          podSelector:
            matchLabels:
              app.kubernetes.io/component: backend
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: den
              app.kubernetes.io/component: operator
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: conservices-data
          podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: conservices-data
          podSelector:
            matchLabels:
              app.kubernetes.io/name: s3
      ports:
        - protocol: TCP
          port: 9000
    # Keycloak admin API (keycloak:8443) and OIDC discovery and signing keys
    # (auth.<domain> resolves to keycloak-public, port 443 -> 8443).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: conservices-identity
          podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
      ports:
        - protocol: TCP
          port: 8443
    # Portal to-dos and role catalogs. The module must admit den-backend.
    - to:
        - namespaceSelector:
            matchLabels:
              conservices.io/tier: module
          podSelector:
            matchLabels:
              app.kubernetes.io/component: backend
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: den-operator
  namespace: conservices-den
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: den
      app.kubernetes.io/component: operator
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: den
              app.kubernetes.io/component: backend
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: conservices-data
          podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: conservices-data
          podSelector:
            matchLabels:
              app.kubernetes.io/name: s3
      ports:
        - protocol: TCP
          port: 9000
---
# Cilium Gateway API: the gateway's Envoy reaches den-frontend with Cilium's
# reserved identity "ingress", which a Kubernetes NetworkPolicy cannot select.
# Needs Cilium's CRDs. Other CNIs and gateways: delete this object and add an
# ingress rule for your gateway's namespace to den-frontend above.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: den-web-from-gateway
  namespace: conservices-den
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: den
      app.kubernetes.io/component: frontend
  ingress:
    - fromEntities: ["ingress"]
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
