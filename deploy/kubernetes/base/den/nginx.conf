# Den frontend nginx for Kubernetes. Mounted over the image's default.conf
# because the image's compose config relies on Docker's DNS (127.0.0.11).
# Listens on 8080 so nginx can run as a non-root user.
#
# Internal TLS: the gateway connects with HTTPS (certificate
# den-frontend-tls), and nginx forwards /api/ to den-backend over HTTPS,
# checking the backend's certificate against the internal CA.
upstream den_backend {
    server den-backend.conservices-den.svc.cluster.local:8080;
}

server {
    listen 8080 ssl;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    ssl_certificate     /etc/conservices-tls/tls.crt;
    ssl_certificate_key /etc/conservices-tls/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    proxy_ssl_trusted_certificate /etc/conservices-internal-ca/ca.crt;
    proxy_ssl_verify              on;
    proxy_ssl_verify_depth        2;
    proxy_ssl_name                den-backend.conservices-den.svc.cluster.local;
    proxy_ssl_server_name         on;
    proxy_ssl_session_reuse       on;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass https://den_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # Removing a module backs its database up before dropping it.
    location ~ ^/api/v1/modules/[^/]+$ {
        proxy_pass https://den_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 30m;
        proxy_buffering off;
    }

    # Installation settings of the web app (sign-in address and the like),
    # mounted at /etc/conservices. Never cached, so a change shows on reload.
    location = /config.json {
        alias /etc/conservices/config.json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location /static/ {
        expires 1y;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # Target of the hidden sign-in iframe (oidc-client-ts silent renew),
    # framed by Den itself, so it gets the same-origin-frameable headers.
    location = /silent-callback.html {
        include /etc/nginx/snippets/security-headers-frameable.conf;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
}
