# Den backend. The image holds two binaries: /den-server (default) and
# /den-migrate. Migrations run in the "migrate" initContainer, so every
# rollout applies them before the new API process starts.
#
# Stateless: backup download links are in the database, and migrate
# containers that start together wait on a Postgres advisory lock, so the
# replica count may be raised and rollouts are rolling.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: den-backend
  namespace: conservices-den
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: den-backend
  namespace: conservices-den
  labels:
    app.kubernetes.io/name: den
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: den
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: den
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: den-backend
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # Group of the mounted TLS key, so it can stay unreadable to others.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: ghcr.io/aglelectronics/den-backend:1.0.0-1
          command: ["/den-migrate"]
          env:
            - name: APP_ENV
              value: production
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: den-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # DATABASE_URL's sslrootcert points here.
            - name: internal-ca
              mountPath: /etc/conservices-internal-ca
              readOnly: true
      containers:
        - name: backend
          image: ghcr.io/aglelectronics/den-backend:1.0.0-1
          envFrom:
            - configMapRef:
                name: den-config
            - secretRef:
                name: den-secrets
          ports:
            - name: https
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /livez
              port: https
              scheme: HTTPS
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Large uploads (branding assets) are buffered here.
            - name: tmp
              mountPath: /tmp
            - name: tls
              mountPath: /etc/conservices-tls
              readOnly: true
            - name: internal-ca
              mountPath: /etc/conservices-internal-ca
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: tls
          secret:
            secretName: den-backend-tls
            defaultMode: 0440
        - name: internal-ca
          configMap:
            name: conservices-internal-ca
---
apiVersion: v1
kind: Service
metadata:
  name: den-backend
  namespace: conservices-den
  labels:
    app.kubernetes.io/name: den
    app.kubernetes.io/component: backend
spec:
  selector:
    app.kubernetes.io/name: den
    app.kubernetes.io/component: backend
  ports:
    - name: https
      port: 8080
      targetPort: https
