# Den backend. The image holds two binaries: /den-server (default) and
# /den-migrate. Migrations run in the "migrate" initContainer, so every
# rollout applies them before the new API process starts.
#
# Keep ONE replica with the Recreate strategy:
#   - backup download links are kept in the process's memory, so a link
#     minted by one replica is unknown to another;
#   - Recreate guarantees two migrate containers never run at once.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: den-backend
  namespace: conservices-den
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: den-backend
  namespace: conservices-den
  labels:
    app.kubernetes.io/name: den
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: den
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: den
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: den-backend
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: ghcr.io/aglelectronics/den-backend:1.0.0-1
          command: ["/den-migrate"]
          env:
            - name: APP_ENV
              value: production
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: den-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: backend
          image: ghcr.io/aglelectronics/den-backend:1.0.0-1
          envFrom:
            - configMapRef:
                name: den-config
            - secretRef:
                name: den-secrets
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Large uploads (branding assets) are buffered here.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: den-backend
  namespace: conservices-den
  labels:
    app.kubernetes.io/name: den
    app.kubernetes.io/component: backend
spec:
  selector:
    app.kubernetes.io/name: den
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
