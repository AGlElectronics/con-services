# Den web app: nginx serving the React bundle and forwarding /api/ to
# den-backend. The image names no domain: the sign-in address and client id
# come from the ConfigMap den-frontend-config, served as /config.json
# (see docs: modules/den/configuration).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: den-frontend
  namespace: conservices-den
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: den-frontend
  namespace: conservices-den
  labels:
    app.kubernetes.io/name: den
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: den
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: den
        app.kubernetes.io/component: frontend
    spec:
      serviceAccountName: den-frontend
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # the "nginx" user of the nginx image
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: ghcr.io/aglelectronics/den-frontend:1.0.0-1
          ports:
            - name: https
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: https
              scheme: HTTPS
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: https
              scheme: HTTPS
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            # Started by the image's entrypoint: reloads nginx every six
            # hours so a renewed certificate is used.
            - name: nginx-conf
              mountPath: /docker-entrypoint.d/90-reload-tls.sh
              subPath: 90-reload-tls.sh
              readOnly: true
            # Served as /config.json.
            - name: frontend-config
              mountPath: /etc/conservices
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            # nginx.pid of older images built on nginx:alpine (/var/run links here)
            - name: run
              mountPath: /run
            # nginx-unprivileged: nginx.pid and temporary files
            - name: tmp
              mountPath: /tmp
            # No subPath: renewed certificates must show up in place.
            - name: tls
              mountPath: /etc/conservices-tls
              readOnly: true
            - name: internal-ca
              mountPath: /etc/conservices-internal-ca
              readOnly: true
      volumes:
        - name: nginx-conf
          configMap:
            name: den-frontend-nginx
            defaultMode: 0555
        - name: frontend-config
          configMap:
            name: den-frontend-config
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: tls
          secret:
            secretName: den-frontend-tls
            defaultMode: 0440
        - name: internal-ca
          configMap:
            name: conservices-internal-ca
---
apiVersion: v1
kind: Service
metadata:
  name: den-frontend
  namespace: conservices-den
  labels:
    app.kubernetes.io/name: den
    app.kubernetes.io/component: frontend
spec:
  selector:
    app.kubernetes.io/name: den
    app.kubernetes.io/component: frontend
  ports:
    - name: https
      port: 443
      targetPort: https
