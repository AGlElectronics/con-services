# Den web app: nginx serving the React bundle and forwarding /api/ to
# den-backend. The OIDC authority and client id are compiled into the
# bundle when the image is built (see docs: modules/den/configuration).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: den-frontend
  namespace: conservices-den
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: den-frontend
  namespace: conservices-den
  labels:
    app.kubernetes.io/name: den
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: den
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: den
        app.kubernetes.io/component: frontend
    spec:
      serviceAccountName: den-frontend
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # the "nginx" user of the nginx image
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: ghcr.io/aglelectronics/den-frontend:1.0.0-1
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            # nginx.pid; /var/run links here in the alpine image
            - name: run
              mountPath: /run
      volumes:
        - name: nginx-conf
          configMap:
            name: den-frontend-nginx
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: den-frontend
  namespace: conservices-den
  labels:
    app.kubernetes.io/name: den
    app.kubernetes.io/component: frontend
spec:
  selector:
    app.kubernetes.io/name: den
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
