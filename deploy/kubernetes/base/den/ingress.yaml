# Replaces the Caddy block "den.conservices.test { reverse_proxy den-frontend:80 }".
# The backend is not exposed directly: the frontend's nginx forwards /api/.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: den
  namespace: conservices-den
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 20m
    # Removing a module backs its database up first and can take minutes.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "1800"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - den.conservices.test
      secretName: conservices-tls
  rules:
    - host: den.conservices.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: den-frontend
                port:
                  name: http
