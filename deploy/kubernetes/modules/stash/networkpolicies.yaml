# conservices-stash: deny everything, then allow
#   Cilium gateway     -> stash-frontend:8080  (CiliumNetworkPolicy at the end)
#   stash-frontend     -> stash-backend:8080
#   hr-backend         -> stash-backend:8080   (HR reads GET /api/role-catalog)
#   stash-backend      -> postgres:5432, s3:9000, den-backend:8080,
#                         keycloak:8443 (OIDC: auth.<domain> resolves to
#                         keycloak-public in conservices-identity)
#   everything         -> DNS
# Every connection except DNS uses TLS (internal CA, base/pki).
# No other module may reach Stash, and Stash may reach no other module.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: conservices-stash
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: conservices-stash
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: stash-frontend
  namespace: conservices-stash
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: stash
      app.kubernetes.io/component: frontend
  policyTypes: ["Ingress", "Egress"]
  # Cilium's gateway is admitted by the CiliumNetworkPolicy stash-web-from-gateway.
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: stash
              app.kubernetes.io/component: backend
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: stash-backend
  namespace: conservices-stash
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: stash
      app.kubernetes.io/component: backend
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: stash
              app.kubernetes.io/component: frontend
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: conservices-hr
          podSelector:
            matchLabels:
              app.kubernetes.io/component: backend
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: conservices-data
          podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: conservices-data
          podSelector:
            matchLabels:
              app.kubernetes.io/name: s3
      ports:
        - protocol: TCP
          port: 9000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: conservices-den
          podSelector:
            matchLabels:
              app.kubernetes.io/name: den
              app.kubernetes.io/component: backend
      ports:
        - protocol: TCP
          port: 8080
    # OIDC discovery and signing keys.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: conservices-identity
          podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
      ports:
        - protocol: TCP
          port: 8443
---
# Cilium Gateway API: the gateway's Envoy reaches stash-frontend with Cilium's
# reserved identity "ingress", which a Kubernetes NetworkPolicy cannot select.
# Needs Cilium's CRDs. Other CNIs and gateways: delete this object and add an
# ingress rule for your gateway's namespace to stash-frontend above.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: stash-web-from-gateway
  namespace: conservices-stash
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: stash
      app.kubernetes.io/component: frontend
  ingress:
    - fromEntities: ["ingress"]
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
