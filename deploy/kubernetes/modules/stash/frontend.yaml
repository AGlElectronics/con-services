apiVersion: v1
kind: ServiceAccount
metadata:
  name: stash-frontend
  namespace: conservices-stash
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stash-frontend
  namespace: conservices-stash
  labels:
    app.kubernetes.io/name: stash
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: stash
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stash
        app.kubernetes.io/component: frontend
    spec:
      serviceAccountName: stash-frontend
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: ghcr.io/aglelectronics/stash-frontend:1.0.0-1
          # Origins the Content Security Policy allows besides the app,
          # filled into /etc/nginx/snippets/security-headers.conf by the
          # image's entrypoint at start-up. For your own domain, patch them
          # from an overlay.
          env:
            - name: KEYCLOAK_ORIGIN
              value: https://auth.conservices.test
            - name: DEN_ORIGIN
              value: ""
            - name: S3_ORIGIN
              value: ""
            - name: EXTRA_CONNECT_SRC
              value: ""
          ports:
            - name: https
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: https
              scheme: HTTPS
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: https
              scheme: HTTPS
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            # Started by the image's entrypoint: reloads nginx every six
            # hours so a renewed certificate is used.
            - name: nginx-conf
              mountPath: /docker-entrypoint.d/90-reload-tls.sh
              subPath: 90-reload-tls.sh
              readOnly: true
            # Served as /config.json (sign-in address and the like).
            - name: frontend-config
              mountPath: /etc/conservices
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /run
            # nginx-unprivileged: nginx.pid and temporary files
            - name: tmp
              mountPath: /tmp
            # The security headers written at start-up (read-only root file system).
            - name: nginx-snippets
              mountPath: /etc/nginx/snippets
            # No subPath: renewed certificates must show up in place.
            - name: tls
              mountPath: /etc/conservices-tls
              readOnly: true
            - name: internal-ca
              mountPath: /etc/conservices-internal-ca
              readOnly: true
      volumes:
        - name: nginx-snippets
          emptyDir: {}
        - name: nginx-conf
          configMap:
            name: stash-frontend-nginx
            defaultMode: 0555
        - name: frontend-config
          configMap:
            name: stash-frontend-config
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: tls
          secret:
            secretName: stash-frontend-tls
            defaultMode: 0440
        - name: internal-ca
          configMap:
            name: conservices-internal-ca
---
apiVersion: v1
kind: Service
metadata:
  name: stash-frontend
  namespace: conservices-stash
  labels:
    app.kubernetes.io/name: stash
    app.kubernetes.io/component: frontend
spec:
  selector:
    app.kubernetes.io/name: stash
    app.kubernetes.io/component: frontend
  ports:
    - name: https
      port: 443
      targetPort: https
