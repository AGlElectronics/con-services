apiVersion: v1
kind: ServiceAccount
metadata:
  name: stash-frontend
  namespace: conservices-stash
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stash-frontend
  namespace: conservices-stash
  labels:
    app.kubernetes.io/name: stash
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: stash
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stash
        app.kubernetes.io/component: frontend
    spec:
      serviceAccountName: stash-frontend
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: ghcr.io/aglelectronics/stash-frontend:1.0.0-1
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /run
      volumes:
        - name: nginx-conf
          configMap:
            name: stash-frontend-nginx
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: stash-frontend
  namespace: conservices-stash
  labels:
    app.kubernetes.io/name: stash
    app.kubernetes.io/component: frontend
spec:
  selector:
    app.kubernetes.io/name: stash
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
