# Stash (inventory) in its own namespace. Apply AFTER the platform is up and
# Den has created Stash's database (Den -> Admin console -> Modules -> New
# module, "Create a database for it"). Walkthrough:
# https://aglelectronics.github.io/con-services/getting-started/how-the-platform-starts/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/part-of: conservices
    includeTemplates: true

resources:
  - namespace.yaml
  - backend.yaml
  - frontend.yaml
  - ingress.yaml
  - networkpolicies.yaml

images:
  - name: ghcr.io/aglelectronics/stash-backend
    newTag: 1.0.0-1
  - name: ghcr.io/aglelectronics/stash-frontend
    newTag: 1.0.0-1

configMapGenerator:
  - name: stash-config
    namespace: conservices-stash
    literals:
      - APP_ENV=production
      - APP_BASE_URL=https://stash.conservices.test
      - HTTP_ADDR=:8080
      - AUTH_MODE=oidc
      - OIDC_ISSUER_URL=https://auth.conservices.test/realms/conservices
      - OIDC_CLIENT_ID=stash-spa
      - OIDC_AUDIENCE=stash-spa
      - ACCESS_CONFIG_PATH=/etc/stash/access-config.toml
      - CORS_ALLOWED_ORIGINS=https://stash.conservices.test
      - S3_ENDPOINT=http://minio.conservices-data.svc.cluster.local:9000
      - S3_BUCKET=stash-data
      - S3_REGION=us-east-1
      - S3_USE_PATH_STYLE=true
      # Pairing URLs carry Den's public address; Stash swaps in this one.
      - DEN_INTERNAL_URL=http://den-backend.conservices-den.svc.cluster.local:8080
  - name: stash-frontend-nginx
    namespace: conservices-stash
    files:
      - default.conf=nginx.conf

# Secret "stash-secrets" comes from the overlay: DATABASE_URL (the URL Den
# shows once when it creates Stash's database), S3_ACCESS_KEY_ID,
# S3_SECRET_ACCESS_KEY.
