# Stash backend. Stash applies its database migrations itself when the
# process starts, so keep ONE replica with the Recreate strategy: two
# starting replicas would migrate at the same time.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stash-backend
  namespace: conservices-stash
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stash-backend
  namespace: conservices-stash
  labels:
    app.kubernetes.io/name: stash
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: stash
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stash
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: stash-backend
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # Group of the mounted TLS key, so it can stay unreadable to others.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: ghcr.io/aglelectronics/stash-backend:1.0.0-1
          envFrom:
            - configMapRef:
                name: stash-config
            - secretRef:
                name: stash-secrets
          env:
            # Named on its own so a Secret without the key stops the pod
            # (CreateContainerConfigError) instead of the backend at start-up.
            - name: DEN_LINK_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: stash-secrets
                  key: DEN_LINK_ENCRYPTION_KEY
          ports:
            - name: https
              containerPort: 8080
          livenessProbe:
            tcpSocket:
              port: https
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: https
              scheme: HTTPS
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: access-config
              mountPath: /etc/stash
              readOnly: true
            # Large uploads are buffered here.
            - name: tmp
              mountPath: /tmp
            - name: tls
              mountPath: /etc/conservices-tls
              readOnly: true
            - name: internal-ca
              mountPath: /etc/conservices-internal-ca
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: tls
          secret:
            secretName: stash-backend-tls
            defaultMode: 0440
        - name: internal-ca
          configMap:
            name: conservices-internal-ca
        # Generated by the overlay from stash/infra/access-config.toml.
        - name: access-config
          configMap:
            name: stash-access-config
---
apiVersion: v1
kind: Service
metadata:
  name: stash-backend
  namespace: conservices-stash
  labels:
    app.kubernetes.io/name: stash
    app.kubernetes.io/component: backend
spec:
  selector:
    app.kubernetes.io/name: stash
    app.kubernetes.io/component: backend
  ports:
    - name: https
      port: 8080
      targetPort: https
