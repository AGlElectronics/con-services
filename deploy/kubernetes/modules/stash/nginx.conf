# Stash frontend nginx for Kubernetes (the image's compose config relies on
# Docker's DNS). Listens on 8080 so nginx can run as a non-root user.
#
# Internal TLS: the gateway connects with HTTPS (certificate
# stash-frontend-tls), and nginx forwards /api/ to stash-backend over HTTPS,
# checking the backend's certificate against the internal CA.
upstream stash_backend {
    server stash-backend.conservices-stash.svc.cluster.local:8080;
}

server {
    listen 8080 ssl;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50m;

    ssl_certificate     /etc/conservices-tls/tls.crt;
    ssl_certificate_key /etc/conservices-tls/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    proxy_ssl_trusted_certificate /etc/conservices-internal-ca/ca.crt;
    proxy_ssl_verify              on;
    proxy_ssl_verify_depth        2;
    proxy_ssl_name                stash-backend.conservices-stash.svc.cluster.local;
    proxy_ssl_server_name         on;
    proxy_ssl_session_reuse       on;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass https://stash_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
        types {} default_type "application/manifest+json";
        try_files $uri =404;
    }

    location = /brand.json {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Installation settings of the web app (sign-in address and the like),
    # mounted at /etc/conservices. Never cached, so a change shows on reload.
    location = /config.json {
        alias /etc/conservices/config.json;
        add_header Cache-Control "no-store" always;
    }

    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Permissions-Policy "camera=(self)" always;
    }
}
