{{- if .Values.networkPolicy.enabled }}
{{- $ns := .Values.namespace -}}
{{- $np := .Values.networkPolicy -}}
# Deny everything in the namespace, then allow only what the module needs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ $ns }}
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: {{ $ns }}
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hr-frontend
  namespace: {{ $ns }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hr
      app.kubernetes.io/component: frontend
  policyTypes: ["Ingress", "Egress"]
  {{- with (include "hr.webIngressFrom" . | trim) }}
  ingress:
    - from:
        {{- . | nindent 8 }}
      ports:
        - { protocol: TCP, port: {{ $.Values.frontend.port }} }
  {{- else }}
  # Cilium's gateway is admitted by the CiliumNetworkPolicy below.
  ingress: []
  {{- end }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: hr
              app.kubernetes.io/component: backend
      ports:
        - { protocol: TCP, port: {{ .Values.backend.port }} }
{{- if ($np.gateway | default dict).cilium }}
---
{{ include "hr.ciliumGatewayPolicy" (dict "root" . "components" (list "frontend")) }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hr-backend
  namespace: {{ $ns }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hr
      app.kubernetes.io/component: backend
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: hr
              app.kubernetes.io/component: frontend
        {{- range $np.allowFromNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
          podSelector:
            matchLabels:
              app.kubernetes.io/component: backend
        {{- end }}
        {{- if $np.den.enabled }}
        # Den's backend reads GET /api/role-catalog and GET /api/portal/todos.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.den.namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: den
              app.kubernetes.io/component: backend
        {{- end }}
      ports:
        - { protocol: TCP, port: {{ .Values.backend.port }} }
  egress:
    {{- with (include "hr.dataEgress" . | trim) }}
    {{- . | nindent 4 }}
    {{- end }}
    {{- if $np.den.enabled }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.den.namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: den
              app.kubernetes.io/component: backend
      ports:
        - { protocol: TCP, port: {{ $np.den.port }} }
    {{- end }}
    {{- with (include "hr.oidcEgress" . | trim) }}
    {{- . | nindent 4 }}
    {{- end }}
    {{- with $np.keycloak }}
    {{- if .enabled }}
    {{- $sel := .podSelector | default (dict "app" "keycloak") }}
    {{- if ne (printf "%s|%s|%d" .namespace (toJson $sel) (int .port)) (include "hr.oidcKey" $) }}
    # Keycloak admin API (KEYCLOAK_BASE_URL). Keycloak's namespace also needs
    # an ingress rule admitting this backend.
    {{- include "hr.egressTo" (dict "namespace" .namespace "podSelector" $sel "port" (int .port)) | nindent 4 }}
    {{- else }}
    # Keycloak admin API: same pods and port as the OIDC rule above.
    {{- end }}
    {{- end }}
    {{- end }}
    {{- range $np.moduleEgressNamespaces }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
          podSelector:
            matchLabels:
              app.kubernetes.io/component: backend
      ports:
        - { protocol: TCP, port: 8080 }
    {{- end }}
    {{- if .Values.googleWorkspace.enabled }}
    {{- with ($np.googleApis | default dict).cidrs }}
    # Google APIs by address range (any CNI). With Cilium, prefer fqdns.
    - to:
        {{- range . }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - { protocol: TCP, port: {{ $np.googleApis.port | default 443 }} }
    {{- end }}
    {{- end }}
    {{- with $np.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- include "hr.externalS3Policy" (dict "root" . "components" (list "backend")) }}
{{- $lookup := $np.addressLookup | default dict }}
{{- if and $lookup.enabled $lookup.fqdns ($np.gateway | default dict).cilium }}
---
# Address suggestions: the backend calls Photon (the browser only calls HR).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hr-address-lookup
  namespace: {{ $ns }}
  labels:
    {{- include "hr.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: hr
      app.kubernetes.io/component: backend
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: ANY }
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        {{- range $lookup.fqdns }}
        - matchName: {{ . | quote }}
        {{- end }}
      toPorts:
        - ports:
            - port: {{ $lookup.port | default 443 | quote }}
              protocol: TCP
{{- end }}
{{- if and $lookup.enabled $lookup.cidrs }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hr-address-lookup
  namespace: {{ $ns }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hr
      app.kubernetes.io/component: backend
  policyTypes: ["Egress"]
  egress:
    - to:
        {{- range $lookup.cidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - { protocol: TCP, port: {{ $lookup.port | default 443 }} }
{{- end }}
{{- $g := $np.googleApis | default dict }}
{{- if and .Values.googleWorkspace.enabled $g.fqdns ($np.gateway | default dict).cilium }}
---
# Google Workspace connector: Google's APIs by host name, with the DNS rule
# that lets Cilium learn the addresses behind the names.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hr-google-apis
  namespace: {{ $ns }}
  labels:
    {{- include "hr.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: hr
      app.kubernetes.io/component: backend
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: ANY }
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        {{- range $g.fqdns }}
        - matchName: {{ . | quote }}
        {{- end }}
      toPorts:
        - ports:
            - port: {{ $g.port | default 443 | quote }}
              protocol: TCP
{{- end }}
{{- end }}
