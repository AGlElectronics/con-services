{{- if .Values.networkPolicy.enabled }}
{{- $ns := .Values.namespace -}}
{{- $np := .Values.networkPolicy -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ $ns }}
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: {{ $ns }}
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hr-frontend
  namespace: {{ $ns }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hr
      app.kubernetes.io/component: frontend
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.ingressControllerNamespace }}
      ports:
        - { protocol: TCP, port: {{ .Values.frontend.port }} }
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: hr
              app.kubernetes.io/component: backend
      ports:
        - { protocol: TCP, port: {{ .Values.backend.port }} }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hr-backend
  namespace: {{ $ns }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hr
      app.kubernetes.io/component: backend
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: hr
              app.kubernetes.io/component: frontend
        {{- range $np.allowFromNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
          podSelector:
            matchLabels:
              app.kubernetes.io/component: backend
        {{- end }}
      ports:
        - { protocol: TCP, port: {{ .Values.backend.port }} }
  egress:
    {{- if $np.data.enabled }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.data.namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - { protocol: TCP, port: {{ $np.data.postgresPort }} }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.data.namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: minio
      ports:
        - { protocol: TCP, port: {{ $np.data.s3Port }} }
    {{- end }}
    {{- if $np.den.enabled }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.den.namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: den
              app.kubernetes.io/component: backend
      ports:
        - { protocol: TCP, port: {{ $np.den.port }} }
    {{- end }}
    {{- if $np.keycloak.enabled }}
    # Keycloak admin API (KEYCLOAK_BASE_URL).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.keycloak.namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
      ports:
        - { protocol: TCP, port: {{ $np.keycloak.port }} }
    {{- end }}
    {{- range $np.moduleEgressNamespaces }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
          podSelector:
            matchLabels:
              app.kubernetes.io/component: backend
      ports:
        - { protocol: TCP, port: 8080 }
    {{- end }}
    {{- if $np.oidcViaIngressController }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.ingressControllerNamespace }}
      ports:
        - { protocol: TCP, port: 443 }
    {{- end }}
    {{- with $np.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
