{{- if .Values.networkPolicy.enabled }}
{{- $ns := .Values.namespace -}}
{{- $np := .Values.networkPolicy -}}
# Deny everything in the namespace, then allow only what the module needs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ $ns }}
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: {{ $ns }}
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hr-frontend
  namespace: {{ $ns }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hr
      app.kubernetes.io/component: frontend
  policyTypes: ["Ingress", "Egress"]
  {{- with (include "hr.webIngressFrom" . | trim) }}
  ingress:
    - from:
        {{- . | nindent 8 }}
      ports:
        - { protocol: TCP, port: {{ $.Values.frontend.port }} }
  {{- else }}
  # Cilium's gateway is admitted by the CiliumNetworkPolicy below.
  ingress: []
  {{- end }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: hr
              app.kubernetes.io/component: backend
      ports:
        - { protocol: TCP, port: {{ .Values.backend.port }} }
{{- if ($np.gateway | default dict).cilium }}
---
{{ include "hr.ciliumGatewayPolicy" (dict "root" . "components" (list "frontend")) }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hr-backend
  namespace: {{ $ns }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hr
      app.kubernetes.io/component: backend
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: hr
              app.kubernetes.io/component: frontend
        {{- range $np.allowFromNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
          podSelector:
            matchLabels:
              app.kubernetes.io/component: backend
        {{- end }}
      ports:
        - { protocol: TCP, port: {{ .Values.backend.port }} }
  egress:
    {{- with (include "hr.dataEgress" . | trim) }}
    {{- . | nindent 4 }}
    {{- end }}
    {{- if $np.den.enabled }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.den.namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: den
              app.kubernetes.io/component: backend
      ports:
        - { protocol: TCP, port: {{ $np.den.port }} }
    {{- end }}
    {{- with (include "hr.oidcEgress" . | trim) }}
    {{- . | nindent 4 }}
    {{- end }}
    {{- with $np.keycloak }}
    {{- if .enabled }}
    {{- $sel := .podSelector | default (dict "app" "keycloak") }}
    {{- if ne (printf "%s|%s|%d" .namespace (toJson $sel) (int .port)) (include "hr.oidcKey" $) }}
    # Keycloak admin API (KEYCLOAK_BASE_URL). Keycloak's namespace also needs
    # an ingress rule admitting this backend.
    {{- include "hr.egressTo" (dict "namespace" .namespace "podSelector" $sel "port" (int .port)) | nindent 4 }}
    {{- else }}
    # Keycloak admin API: same pods and port as the OIDC rule above.
    {{- end }}
    {{- end }}
    {{- end }}
    {{- range $np.moduleEgressNamespaces }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
          podSelector:
            matchLabels:
              app.kubernetes.io/component: backend
      ports:
        - { protocol: TCP, port: 8080 }
    {{- end }}
    {{- with $np.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- include "hr.externalS3Policy" (dict "root" . "components" (list "backend")) }}
{{- end }}
