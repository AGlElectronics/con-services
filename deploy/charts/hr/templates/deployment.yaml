{{- $ns := .Values.namespace -}}
{{- $tls := .Values.internalTLS.enabled -}}
{{- $scheme := include "hr.scheme" . -}}
{{- if and .Values.backend.singleReplica (ne (int .Values.backend.replicas) 1) }}
{{- fail (printf "backend.replicas must be 1 for this module (got %v): %s" .Values.backend.replicas .Values.backend.singleReplicaReason) }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hr-backend
  namespace: {{ $ns }}
  labels:
    {{- include "hr.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hr-frontend
  namespace: {{ $ns }}
  labels:
    {{- include "hr.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
# The HR server never migrates; the migrate initContainer applies
# pending migrations and exits before the server starts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hr-backend
  namespace: {{ $ns }}
  labels:
    {{- include "hr.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hr
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "hr.labels" . | nindent 8 }}
        app.kubernetes.io/component: backend
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: hr-backend
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.backend.terminationGracePeriodSeconds | default 30 }}
      {{- with (include "hr.scheduling" (dict "root" . "component" "backend" "replicas" .Values.backend.replicas) | trim) }}{{ . | nindent 6 }}{{ end }}
      securityContext:
        {{- include "hr.podSecurity" . | nindent 8 }}
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      {{- with .Values.backend.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: migrate
          image: {{ include "hr.image" (dict "root" . "name" "migrate") | quote }}
          imagePullPolicy: {{ .Values.image.migrate.pullPolicy }}
          env:
            - name: APP_ENV
              value: {{ .Values.config.APP_ENV | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "existingSecret is required" .Values.existingSecret }}
                  key: DATABASE_URL
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            {{- include "hr.containerSecurity" . | nindent 12 }}
          {{- if $tls }}
          # DATABASE_URL uses sslrootcert=/etc/conservices-internal-ca/ca.crt.
          volumeMounts:
            - name: internal-ca
              mountPath: /etc/conservices-internal-ca
              readOnly: true
          {{- end }}
      containers:
        - name: backend
          image: {{ include "hr.image" (dict "root" . "name" "backend") | quote }}
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
            - secretRef:
                name: {{ .Values.existingSecret }}
          {{- with .Values.backend.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: {{ $scheme }}
              containerPort: {{ .Values.backend.port }}
          livenessProbe:
            httpGet:
              path: /livez
              port: {{ $scheme }}
              scheme: {{ upper $scheme }}
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ $scheme }}
              scheme: {{ upper $scheme }}
            periodSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            {{- include "hr.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if $tls }}
            {{- include "hr.tlsVolumeMounts" . | nindent 12 }}
            {{- end }}
            {{- if .Values.googleWorkspace.enabled }}
            - name: google-workspace
              mountPath: /etc/conservices-google
              readOnly: true
            {{- end }}
            {{- with .Values.backend.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if $tls }}
        {{- include "hr.tlsVolumes" (dict "root" . "secret" "hr-backend-tls") | nindent 8 }}
        {{- end }}
        {{- if .Values.googleWorkspace.enabled }}
        - name: google-workspace
          secret:
            secretName: {{ required "googleWorkspace.existingSecret is required" .Values.googleWorkspace.existingSecret }}
            defaultMode: 0440
            items:
              - key: credentials.json
                path: credentials.json
        {{- end }}
        {{- with .Values.backend.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hr-frontend
  namespace: {{ $ns }}
  labels:
    {{- include "hr.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: hr
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "hr.labels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/frontend-config: {{ include (print $.Template.BasePath "/frontend-config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: hr-frontend
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.frontend.terminationGracePeriodSeconds | default 30 }}
      {{- with (include "hr.scheduling" (dict "root" . "component" "frontend" "replicas" .Values.frontend.replicas) | trim) }}{{ . | nindent 6 }}{{ end }}
      securityContext:
        {{- include "hr.podSecurity" . | nindent 8 }}
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      containers:
        - name: frontend
          image: {{ include "hr.image" (dict "root" . "name" "frontend") | quote }}
          imagePullPolicy: {{ .Values.image.frontend.pullPolicy }}
          env:
            - name: KEYCLOAK_ORIGIN
              value: {{ .Values.frontend.securityHeaders.keycloakOrigin | quote }}
            - name: DEN_ORIGIN
              value: {{ .Values.frontend.securityHeaders.denOrigin | quote }}
            - name: S3_ORIGIN
              value: {{ .Values.frontend.securityHeaders.s3Origin | quote }}
            - name: EXTRA_CONNECT_SRC
              value: {{ .Values.frontend.securityHeaders.extraConnectSrc | quote }}
            - name: EXTRA_FRAME_SRC
              value: {{ .Values.frontend.securityHeaders.extraFrameSrc | default "" | quote }}
          ports:
            - name: {{ $scheme }}
              containerPort: {{ .Values.frontend.port }}
          readinessProbe:
            httpGet:
              path: /
              port: {{ $scheme }}
              scheme: {{ upper $scheme }}
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: {{ $scheme }}
              scheme: {{ upper $scheme }}
            periodSeconds: 20
          {{- with .Values.frontend.preStopSleepSeconds }}
          # Keep serving while the gateway drops this pod from its endpoints.
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep {{ . }}"]
          {{- end }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext:
            {{- include "hr.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            {{- if $tls }}
            - name: nginx-conf
              mountPath: /docker-entrypoint.d/90-reload-tls.sh
              subPath: 90-reload-tls.sh
              readOnly: true
            {{- include "hr.tlsVolumeMounts" . | nindent 12 }}
            {{- end }}
            # Served as /config.json (frontend.config).
            - name: frontend-config
              mountPath: /etc/conservices
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /run
            # nginx-unprivileged: nginx.pid and temporary files
            - name: tmp
              mountPath: /tmp
            # The image entrypoint writes the filled security-headers snippet
            # here. A read-only root filesystem cannot hold that file.
            - name: nginx-snippets
              mountPath: /etc/nginx/snippets
      volumes:
        - name: nginx-conf
          configMap:
            name: {{ .Release.Name }}-frontend-nginx
            defaultMode: 0555
        - name: frontend-config
          configMap:
            name: {{ .Release.Name }}-frontend-config
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: nginx-snippets
          emptyDir: {}
        {{- if $tls }}
        {{- include "hr.tlsVolumes" (dict "root" . "secret" "hr-frontend-tls") | nindent 8 }}
        {{- end }}
