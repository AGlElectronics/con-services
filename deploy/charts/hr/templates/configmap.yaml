apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "hr.labels" . | nindent 4 }}
data:
  {{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
---
# Adapted from hr/infra/nginx.conf: listens on 8080 so nginx runs as non-root.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-frontend-nginx
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "hr.labels" . | nindent 4 }}
data:
  default.conf: |
    upstream hr_backend {
        server hr-backend.{{ .Values.namespace }}.svc.cluster.local:{{ .Values.backend.port }};
    }
    server {
        listen {{ .Values.frontend.port }};
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 10m;
        gzip on;
        gzip_types text/plain text/css application/json application/javascript image/svg+xml;
        gzip_min_length 1024;
        location /api/ {
            proxy_pass http://hr_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_buffering off;
        }
        location = /livez { proxy_pass http://hr_backend/livez; }
        location = /readyz { proxy_pass http://hr_backend/readyz; }
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache" always;
        }
    }
