{{- $tls := .Values.internalTLS.enabled -}}
{{- $ns := .Values.namespace -}}
{{- $scheme := include "den.scheme" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ $ns }}
  labels:
    {{- include "den.labels" . | nindent 4 }}
data:
  {{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- with .Values.preregisterModules }}
  {{- if hasKey $.Values.config "DEN_PREREGISTER_MODULES" }}
  {{- fail "config.DEN_PREREGISTER_MODULES is not allowed: set preregisterModules instead" }}
  {{- end }}
  {{- range . }}
  {{- if not (and .slug .display_name .base_url) }}
  {{- fail (printf "preregisterModules: every entry needs slug, display_name and base_url, got %s" (toJson .)) }}
  {{- end }}
  {{- end }}
  DEN_PREREGISTER_MODULES: {{ toJson . | quote }}
  {{- end }}
  {{- if and .Values.operator.enabled (not (hasKey .Values.config "OPERATOR_URL")) }}
  OPERATOR_URL: {{ printf "%s://den-operator.%s.svc.cluster.local:%v" $scheme $ns .Values.operator.port | quote }}
  {{- end }}
  {{- with (include "den.tlsEnv" (dict "root" . "config" .Values.config) | trim) }}{{ . | nindent 2 }}{{ end }}
{{- if .Values.operator.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-operator-config
  namespace: {{ $ns }}
  labels:
    {{- include "den.labels" . | nindent 4 }}
data:
  {{- range $k, $v := .Values.operatorConfig }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- with (include "den.tlsEnv" (dict "root" . "config" .Values.operatorConfig) | trim) }}{{ . | nindent 2 }}{{ end }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-frontend-nginx
  namespace: {{ $ns }}
  labels:
    {{- include "den.labels" . | nindent 4 }}
data:
  # Mounted over the image's default.conf, which relies on Docker's DNS.
  default.conf: |
    upstream den_backend {
        server den-backend.{{ $ns }}.svc.cluster.local:{{ .Values.backend.port }};
    }
    server {
        {{- if $tls }}
        listen {{ .Values.frontend.port }} ssl;
        {{- else }}
        listen {{ .Values.frontend.port }};
        {{- end }}
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size {{ .Values.frontend.clientMaxBodySize }};
        {{- if $tls }}
        ssl_certificate     /etc/conservices-tls/tls.crt;
        ssl_certificate_key /etc/conservices-tls/tls.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        proxy_ssl_trusted_certificate /etc/conservices-internal-ca/ca.crt;
        proxy_ssl_verify              on;
        proxy_ssl_verify_depth        2;
        proxy_ssl_name                den-backend.{{ $ns }}.svc.cluster.local;
        proxy_ssl_server_name         on;
        proxy_ssl_session_reuse       on;
        {{- end }}
        gzip on;
        gzip_types text/plain text/css application/json application/javascript image/svg+xml;
        gzip_min_length 1024;
        location /api/ {
            proxy_pass {{ $scheme }}://den_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 120s;
            proxy_buffering off;
        }
        # Removing a module backs its database up before dropping it.
        location ~ ^/api/v1/modules/[^/]+$ {
            proxy_pass {{ $scheme }}://den_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout {{ .Values.frontend.moduleRemovalTimeout }};
            proxy_buffering off;
        }
        # Installation settings of the web app (sign-in address and the like),
        # mounted at /etc/conservices. Never cached, so a change shows on reload.
        # Security headers: the image writes the snippets from
        # KEYCLOAK_ORIGIN and friends at start-up. Included in every
        # location that serves the app, never in the /api/ locations (the
        # backend sends its own).
        location = /config.json {
            alias /etc/conservices/config.json;
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "no-store" always;
        }

        location /static/ {
            expires 1y;
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "public, immutable" always;
            try_files $uri =404;
        }
        # Target of the hidden sign-in iframe, framed by Den itself.
        # Shared snippet: frame-ancestors 'self', X-Frame-Options SAMEORIGIN.
        location = /silent-callback.html {
            include /etc/nginx/snippets/security-headers-frame-self.conf;
            add_header Cache-Control "no-cache" always;
        }
        location / {
            try_files $uri $uri/ /index.html;
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "no-cache, must-revalidate" always;
        }
    }
  {{- if $tls }}
  # Started by the nginx image's entrypoint. nginx reads its certificate
  # only at start and on reload; reload every six hours to pick up a
  # certificate renewed by cert-manager.
  90-reload-tls.sh: |
    #!/bin/sh
    (
      while sleep 21600; do
        nginx -s reload
      done
    ) &
  {{- end }}
