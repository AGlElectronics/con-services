{{- $ns := .Values.namespace -}}
{{- $tls := .Values.internalTLS.enabled -}}
{{- $scheme := include "den.scheme" . -}}
{{- if and .Values.backend.singleReplica (ne (int .Values.backend.replicas) 1) }}
{{- fail (printf "backend.replicas must be 1 for Den (got %v): %s" .Values.backend.replicas .Values.backend.singleReplicaReason) }}
{{- end }}
{{- if and .Values.operator.enabled (ne (int .Values.operator.replicas) 1) }}
{{- fail (printf "operator.replicas must be 1 (got %v): the backup scheduler and its lock live in the process" .Values.operator.replicas) }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: den-backend
  namespace: {{ $ns }}
  labels:
    {{- include "den.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: den-frontend
  namespace: {{ $ns }}
  labels:
    {{- include "den.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
# Den backend. Migrations run in the "migrate" initContainer (/den-migrate
# from the same image), so every rollout applies them before the new API
# process starts. One replica with Recreate: backup download links live in
# the process's memory, and two migrate containers must never run at once.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: den-backend
  namespace: {{ $ns }}
  labels:
    {{- include "den.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: den
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "den.labels" . | nindent 8 }}
        app.kubernetes.io/component: backend
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: den-backend
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.backend.terminationGracePeriodSeconds }}
      {{- with (include "den.scheduling" (dict "root" . "component" "backend" "replicas" .Values.backend.replicas) | trim) }}{{ . | nindent 6 }}{{ end }}
      securityContext:
        {{- include "den.podSecurity" . | nindent 8 }}
        runAsUser: 65532
        runAsGroup: 65532
        # Group of the mounted TLS key, so it can stay unreadable to others.
        fsGroup: 65532
      {{- with .Values.backend.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: migrate
          image: {{ include "den.image" (dict "root" . "name" "backend") | quote }}
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          command: ["/den-migrate"]
          env:
            - name: APP_ENV
              value: {{ .Values.config.APP_ENV | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "existingSecret is required" .Values.existingSecret }}
                  key: DATABASE_URL
          resources:
            {{- toYaml .Values.backend.migrate.resources | nindent 12 }}
          securityContext:
            {{- include "den.containerSecurity" . | nindent 12 }}
          {{- if or $tls .Values.backend.extraVolumeMounts }}
          volumeMounts:
            {{- if $tls }}
            # DATABASE_URL's sslrootcert points here.
            - name: internal-ca
              mountPath: /etc/conservices-internal-ca
              readOnly: true
            {{- end }}
            {{- with .Values.backend.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      containers:
        - name: backend
          image: {{ include "den.image" (dict "root" . "name" "backend") | quote }}
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
            - secretRef:
                name: {{ .Values.existingSecret }}
          {{- with .Values.backend.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: {{ $scheme }}
              containerPort: {{ .Values.backend.port }}
          livenessProbe:
            httpGet:
              path: /livez
              port: {{ $scheme }}
              scheme: {{ upper $scheme }}
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ $scheme }}
              scheme: {{ upper $scheme }}
            periodSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            {{- include "den.containerSecurity" . | nindent 12 }}
          volumeMounts:
            # Large uploads (branding assets) are buffered here.
            - name: tmp
              mountPath: /tmp
            {{- if $tls }}
            {{- include "den.tlsVolumeMounts" . | nindent 12 }}
            {{- end }}
            {{- with .Values.backend.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if $tls }}
        {{- include "den.tlsVolumes" (dict "root" . "secret" "den-backend-tls") | nindent 8 }}
        {{- end }}
        {{- with .Values.backend.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
---
# Den web app: nginx serving the React bundle and forwarding /api/ to
# den-backend. Stateless, so it runs several replicas.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: den-frontend
  namespace: {{ $ns }}
  labels:
    {{- include "den.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: den
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "den.labels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/frontend-config: {{ include (print $.Template.BasePath "/frontend-config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: den-frontend
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.frontend.terminationGracePeriodSeconds }}
      {{- with (include "den.scheduling" (dict "root" . "component" "frontend" "replicas" .Values.frontend.replicas) | trim) }}{{ . | nindent 6 }}{{ end }}
      securityContext:
        {{- include "den.podSecurity" . | nindent 8 }}
        # the "nginx" user of the nginx image
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      containers:
        - name: frontend
          image: {{ include "den.image" (dict "root" . "name" "frontend") | quote }}
          imagePullPolicy: {{ .Values.image.frontend.pullPolicy }}
          ports:
            - name: {{ $scheme }}
              containerPort: {{ .Values.frontend.port }}
          readinessProbe:
            httpGet:
              path: /
              port: {{ $scheme }}
              scheme: {{ upper $scheme }}
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: {{ $scheme }}
              scheme: {{ upper $scheme }}
            periodSeconds: 20
          {{- with .Values.frontend.preStopSleepSeconds }}
          # Keep serving while the gateway drops this pod from its endpoints.
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep {{ . }}"]
          {{- end }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext:
            {{- include "den.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            {{- if $tls }}
            - name: nginx-conf
              mountPath: /docker-entrypoint.d/90-reload-tls.sh
              subPath: 90-reload-tls.sh
              readOnly: true
            {{- include "den.tlsVolumeMounts" . | nindent 12 }}
            {{- end }}
            # Served as /config.json (frontend.config).
            - name: frontend-config
              mountPath: /etc/conservices
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            # nginx.pid of older images built on nginx:alpine (/var/run links here)
            - name: run
              mountPath: /run
            # nginx-unprivileged: nginx.pid and temporary files
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nginx-conf
          configMap:
            name: {{ .Release.Name }}-frontend-nginx
            defaultMode: 0555
        - name: frontend-config
          configMap:
            name: {{ .Release.Name }}-frontend-config
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- if $tls }}
        {{- include "den.tlsVolumes" (dict "root" . "secret" "den-frontend-tls") | nindent 8 }}
        {{- end }}
{{- if .Values.operator.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: den-operator
  namespace: {{ $ns }}
  labels:
    {{- include "den.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
# Den operator: the only component with the PostgreSQL superuser login.
# Exactly one replica with Recreate: the backup scheduler and its lock live
# in the process. It does not talk to the Kubernetes API, so no RBAC.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: den-operator
  namespace: {{ $ns }}
  labels:
    {{- include "den.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
spec:
  replicas: {{ .Values.operator.replicas }}
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: den
      app.kubernetes.io/component: operator
  template:
    metadata:
      labels:
        {{- include "den.labels" . | nindent 8 }}
        app.kubernetes.io/component: operator
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: den-operator
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.operator.terminationGracePeriodSeconds }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- include "den.podSecurity" . | nindent 8 }}
        # the "postgres" user (UID 70) of the operator image (Alpine with the
        # PostgreSQL 16 client tools pg_dump and psql)
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
      containers:
        - name: operator
          image: {{ include "den.image" (dict "root" . "name" "operator") | quote }}
          imagePullPolicy: {{ .Values.image.operator.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-operator-config
            - secretRef:
                name: {{ required "operator.existingSecret is required" .Values.operator.existingSecret }}
          {{- with .Values.operator.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: {{ $scheme }}
              containerPort: {{ .Values.operator.port }}
          livenessProbe:
            httpGet:
              path: /livez
              port: {{ $scheme }}
              scheme: {{ upper $scheme }}
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /livez
              port: {{ $scheme }}
              scheme: {{ upper $scheme }}
            periodSeconds: 10
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
          securityContext:
            {{- include "den.containerSecurity" . | nindent 12 }}
          volumeMounts:
            # Dumps are written here before upload.
            - name: tmp
              mountPath: /tmp
            {{- if $tls }}
            # PG_ADMIN_URL's sslrootcert points at the internal CA; pg_dump
            # uses it too.
            {{- include "den.tlsVolumeMounts" . | nindent 12 }}
            {{- end }}
            {{- with .Values.operator.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.operator.tmpSizeLimit }}
        {{- if $tls }}
        {{- include "den.tlsVolumes" (dict "root" . "secret" "den-operator-tls") | nindent 8 }}
        {{- end }}
        {{- with .Values.operator.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
