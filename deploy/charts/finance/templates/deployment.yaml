{{- $ns := .Values.namespace -}}
{{- $tls := .Values.internalTLS.enabled -}}
{{- $scheme := include "finance.scheme" . -}}
{{- if and .Values.backend.singleReplica (ne (int .Values.backend.replicas) 1) }}
{{- fail (printf "backend.replicas must be 1 for this module (got %v): %s" .Values.backend.replicas .Values.backend.singleReplicaReason) }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: finance-backend
  namespace: {{ $ns }}
  labels:
    {{- include "finance.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: finance-frontend
  namespace: {{ $ns }}
  labels:
    {{- include "finance.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
# The server never migrates; the migrate initContainer applies pending
# migrations and exits before the server starts. Recreate: old and new pods
# never run (or migrate) side by side. Usually one replica (see
# backend.replicas in values.yaml for why); the web app is what scales.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance-backend
  namespace: {{ $ns }}
  labels:
    {{- include "finance.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: finance
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "finance.labels" . | nindent 8 }}
        app.kubernetes.io/component: backend
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: finance-backend
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.backend.terminationGracePeriodSeconds }}
      {{- with (include "finance.scheduling" (dict "root" . "component" "backend" "replicas" .Values.backend.replicas) | trim) }}{{ . | nindent 6 }}{{ end }}
      securityContext:
        {{- include "finance.podSecurity" . | nindent 8 }}
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      {{- with .Values.backend.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: migrate
          image: {{ include "finance.image" (dict "root" . "name" "migrate") | quote }}
          imagePullPolicy: {{ .Values.image.migrate.pullPolicy }}
          env:
            - name: APP_ENV
              value: {{ .Values.config.APP_ENV | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "existingSecret is required" .Values.existingSecret }}
                  key: DATABASE_URL
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            {{- include "finance.containerSecurity" . | nindent 12 }}
          {{- if $tls }}
          volumeMounts:
            - name: internal-ca
              mountPath: /etc/conservices-internal-ca
              readOnly: true
          {{- end }}
      containers:
        - name: backend
          image: {{ include "finance.image" (dict "root" . "name" "backend") | quote }}
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
            - secretRef:
                name: {{ .Values.existingSecret }}
          env:
            # Named on its own so a Secret without the key stops the pod
            # (CreateContainerConfigError) instead of the backend at start-up.
            - name: DEN_LINK_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: DEN_LINK_ENCRYPTION_KEY
                  optional: {{ eq (lower (trim (toString .Values.config.APP_ENV))) "development" }}
          {{- with .Values.backend.extraEnv }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: {{ $scheme }}
              containerPort: {{ .Values.backend.port }}
          livenessProbe:
            httpGet:
              path: /livez
              port: {{ $scheme }}
              scheme: {{ upper $scheme }}
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ $scheme }}
              scheme: {{ upper $scheme }}
            periodSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            {{- include "finance.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.accessConfig.enabled }}
            - name: access-config
              mountPath: {{ .Values.accessConfig.mountPath }}
              readOnly: true
            {{- end }}
            {{- with .Values.backend.buffer }}
            {{- if .enabled }}
            - name: buffer
              mountPath: {{ .mountPath }}
            {{- end }}
            {{- end }}
            {{- if $tls }}
            {{- include "finance.tlsVolumeMounts" . | nindent 12 }}
            {{- end }}
            {{- with .Values.backend.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.accessConfig.enabled }}
        - name: access-config
          configMap:
            name: {{ .Values.accessConfig.existingConfigMap }}
        {{- end }}
        {{- with .Values.backend.buffer }}
        {{- if .enabled }}
        - name: buffer
          {{- if .persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ $.Release.Name }}-buffer
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        {{- end }}
        {{- if $tls }}
        {{- include "finance.tlsVolumes" (dict "root" . "secret" "finance-backend-tls") | nindent 8 }}
        {{- end }}
        {{- with .Values.backend.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance-frontend
  namespace: {{ $ns }}
  labels:
    {{- include "finance.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: finance
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "finance.labels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/frontend-config: {{ include (print $.Template.BasePath "/frontend-config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: finance-frontend
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.frontend.terminationGracePeriodSeconds | default 30 }}
      {{- with (include "finance.scheduling" (dict "root" . "component" "frontend" "replicas" .Values.frontend.replicas) | trim) }}{{ . | nindent 6 }}{{ end }}
      securityContext:
        {{- include "finance.podSecurity" . | nindent 8 }}
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      containers:
        - name: frontend
          image: {{ include "finance.image" (dict "root" . "name" "frontend") | quote }}
          imagePullPolicy: {{ .Values.image.frontend.pullPolicy }}
          # Filled into the security headers by the image's entrypoint
          # (/etc/nginx/templates -> /etc/nginx/snippets) at start-up.
          {{- $sh := .Values.frontend.securityHeaders | default dict }}
          env:
            - name: KEYCLOAK_ORIGIN
              value: {{ include "finance.keycloakOrigin" . | quote }}
            - name: DEN_ORIGIN
              value: {{ $sh.denOrigin | default "" | quote }}
            - name: S3_ORIGIN
              value: {{ $sh.s3Origin | default "" | quote }}
            - name: EXTRA_CONNECT_SRC
              value: {{ $sh.extraConnectSrc | default "" | quote }}
            # Empty. Finance does not embed sandboxed HTML. Silent sign-in
            # frames /silent-callback.html through the frame-self snippet.
            - name: EXTRA_FRAME_SRC
              value: ""
          ports:
            - name: {{ $scheme }}
              containerPort: {{ .Values.frontend.port }}
          readinessProbe:
            httpGet:
              path: /
              port: {{ $scheme }}
              scheme: {{ upper $scheme }}
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: {{ $scheme }}
              scheme: {{ upper $scheme }}
            periodSeconds: 20
          {{- with .Values.frontend.preStopSleepSeconds }}
          # Keep serving while the gateway drops this pod from its endpoints.
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep {{ . }}"]
          {{- end }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext:
            {{- include "finance.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            {{- if $tls }}
            - name: nginx-conf
              mountPath: /docker-entrypoint.d/90-reload-tls.sh
              subPath: 90-reload-tls.sh
              readOnly: true
            {{- include "finance.tlsVolumeMounts" . | nindent 12 }}
            {{- end }}
            # Served as /config.json (frontend.config).
            - name: frontend-config
              mountPath: /etc/conservices
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /run
            # nginx-unprivileged: nginx.pid and temporary files
            - name: tmp
              mountPath: /tmp
            # The security headers written at start-up (read-only root file system).
            - name: nginx-snippets
              mountPath: /etc/nginx/snippets
      volumes:
        - name: nginx-snippets
          emptyDir: {}
        - name: nginx-conf
          configMap:
            name: {{ .Release.Name }}-frontend-nginx
            defaultMode: 0555
        - name: frontend-config
          configMap:
            name: {{ .Release.Name }}-frontend-config
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- if $tls }}
        {{- include "finance.tlsVolumes" (dict "root" . "secret" "finance-frontend-tls") | nindent 8 }}
        {{- end }}
