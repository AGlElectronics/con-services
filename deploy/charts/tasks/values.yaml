# Tasks Helm chart values. STUB (chart version 0.1.0).
# Docs: https://aglelectronics.github.io/con-services/modules/tasks/setup/
#
# The namespace is NOT created by this chart. Create it first with the
# labels the platform NetworkPolicies expect (see the setup page):
#   conservices.io/tier: module
#   pod-security.kubernetes.io/enforce: restricted

namespace: conservices-tasks

image:
  backend:
    repository: ghcr.io/aglelectronics/tasks-backend
    # MAJOR.MINOR.PATCH-BUILD. Never "latest". Use the same tag for all three.
    tag: "1.0.0-1"
    pullPolicy: IfNotPresent
  frontend:
    repository: ghcr.io/aglelectronics/tasks-frontend
    tag: "1.0.0-1"
    pullPolicy: IfNotPresent
  # One-shot migrator (/migrate). Runs as an initContainer of the backend.
  migrate:
    repository: ghcr.io/aglelectronics/tasks-migrate
    tag: "1.0.0-1"
    pullPolicy: IfNotPresent

# Name of an existing Secret (created by your secret manager, for example an
# ExternalSecret) with the keys DATABASE_URL, S3_ACCESS_KEY_ID,
# S3_SECRET_ACCESS_KEY and TASKS_SERVICE_TOKEN. This chart never creates
# Secrets.
existingSecret: tasks-secrets

# Tasks' access config (roles, permissions, OIDC group bindings).
#   kubectl create configmap tasks-access-config -n conservices-tasks \
#     --from-file=access-config.toml=tasks/infra/access-config.toml
accessConfig:
  enabled: true
  existingConfigMap: tasks-access-config
  mountPath: /etc/tasks
  fileName: access-config.toml

# Non-secret settings, rendered into the ConfigMap "<release>-config".
# Every key is documented on the Tasks configuration page.
config:
  APP_ENV: production
  APP_BASE_URL: https://tasks.conservices.test
  HTTP_ADDR: ":8080"
  AUTH_MODE: oidc
  OIDC_ISSUER_URL: https://auth.conservices.test/realms/conservices
  OIDC_CLIENT_ID: tasks-spa
  OIDC_AUDIENCE: tasks-spa
  CORS_ALLOWED_ORIGINS: https://tasks.conservices.test
  # Attachments. Empty S3_ENDPOINT turns them off (uploads answer 503).
  S3_ENDPOINT: http://minio.conservices-data.svc.cluster.local:9000
  S3_BUCKET: tasks-data
  S3_REGION: us-east-1
  S3_USE_PATH_STYLE: "true"
  DEN_INTERNAL_URL: http://den-backend.conservices-den.svc.cluster.local:8080

backend:
  # MUST stay 1. The per-user rate limiter lives in the process, and the
  # due-date automation sweep runs on a one-minute timer in every process;
  # two replicas would race. The chart refuses any other value.
  replicas: 1
  singleReplica: true
  singleReplicaReason: "in-process rate limiter and due-date sweep (tasks README, Operations notes)"
  port: 8080
  terminationGracePeriodSeconds: 30
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  hostAliases: []

frontend:
  replicas: 2
  port: 8080
  # Attachments are up to 25 MB.
  clientMaxBodySize: 27m
  websocketPathRegex: ""
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { cpu: 200m, memory: 64Mi }

ingress:
  enabled: true
  className: nginx
  host: tasks.conservices.test
  tlsSecretName: conservices-tls
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 27m

networkPolicy:
  enabled: true
  ingressControllerNamespace: ingress-nginx
  oidcViaIngressController: true
  den:
    enabled: true
    namespace: conservices-den
    port: 8080
  data:
    enabled: true
    namespace: conservices-data
    postgresPort: 5432
    s3: true
    s3Port: 9000
  # HR reads GET /api/role-catalog and calls POST /api/internal/departments
  # (the department hook, bearer TASKS_SERVICE_TOKEN). HR's namespace needs
  # a matching egress rule.
  allowFromNamespaces:
    - conservices-hr
  keycloakAdmin:
    enabled: false
  extraEgress: []
