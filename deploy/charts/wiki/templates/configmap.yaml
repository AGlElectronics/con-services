{{- $tls := .Values.internalTLS.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "wiki.labels" . | nindent 4 }}
data:
  {{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- if .Values.accessConfig.enabled }}
  ACCESS_CONFIG_PATH: {{ printf "%s/%s" .Values.accessConfig.mountPath .Values.accessConfig.fileName | quote }}
  {{- end }}
  {{- if $tls }}
  TLS_CERT_FILE: /etc/conservices-tls/tls.crt
  TLS_KEY_FILE: /etc/conservices-tls/tls.key
  {{- if not (hasKey .Values.config "SSL_CERT_DIR") }}
  SSL_CERT_DIR: /etc/conservices-internal-ca
  {{- end }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-frontend-nginx
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "wiki.labels" . | nindent 4 }}
data:
  default.conf: |
    upstream wiki_backend {
        server wiki-backend.{{ .Values.namespace }}.svc.cluster.local:{{ .Values.backend.port }};
    }
    {{- if .Values.frontend.websocketPathRegex }}
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
    {{- end }}
    server {
        {{- if $tls }}
        listen {{ .Values.frontend.port }} ssl;
        {{- else }}
        listen {{ .Values.frontend.port }};
        {{- end }}
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size {{ .Values.frontend.clientMaxBodySize }};
        {{- if $tls }}
        ssl_certificate     /etc/conservices-tls/tls.crt;
        ssl_certificate_key /etc/conservices-tls/tls.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        proxy_ssl_trusted_certificate /etc/conservices-internal-ca/ca.crt;
        proxy_ssl_verify              on;
        proxy_ssl_verify_depth        2;
        proxy_ssl_name                wiki-backend.{{ .Values.namespace }}.svc.cluster.local;
        proxy_ssl_server_name         on;
        proxy_ssl_session_reuse       on;
        {{- end }}
        gzip on;
        gzip_types text/plain text/css application/json application/javascript image/svg+xml;
        gzip_min_length 1024;
        {{- if .Values.frontend.websocketPathRegex }}
        location ~ {{ .Values.frontend.websocketPathRegex }} {
            proxy_pass {{ include "wiki.scheme" . }}://wiki_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_buffering off;
        }
        {{- end }}
        location /api/ {
            proxy_pass {{ include "wiki.scheme" . }}://wiki_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_buffering off;
        }
        location = /manifest.webmanifest {
            add_header Cache-Control "no-cache" always;
            types {} default_type "application/manifest+json";
            try_files $uri =404;
        }
        location = /brand.json {
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
        }
        # Installation settings of the web app (sign-in address and the like),
        # mounted at /etc/conservices. Never cached, so a change shows on reload.
        location = /config.json {
            alias /etc/conservices/config.json;
            add_header Cache-Control "no-store" always;
        }

        location /static/ {
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            try_files $uri =404;
        }
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache" always;
        }
    }
  {{- if $tls }}
  # Started by the nginx image's entrypoint. nginx reads its certificate
  # only at start and on reload; reload every six hours to pick up a
  # certificate renewed by cert-manager.
  90-reload-tls.sh: |
    #!/bin/sh
    (
      while sleep 21600; do
        nginx -s reload
      done
    ) &
  {{- end }}
