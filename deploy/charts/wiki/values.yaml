# Wiki Helm chart values. STUB (chart version 0.1.0).
# Docs: https://aglelectronics.github.io/con-services/modules/wiki/setup/
#
# The namespace is NOT created by this chart. Create it first with the
# labels the platform NetworkPolicies expect (see the setup page):
#   conservices.io/tier: module
#   pod-security.kubernetes.io/enforce: restricted

# Namespace the release is installed into (use `helm install -n <namespace>`
# with the same value).
namespace: conservices-wiki

image:
  backend:
    repository: ghcr.io/aglelectronics/wiki-backend
    # MAJOR.MINOR.PATCH-BUILD. Never "latest". Use the same tag for all three.
    tag: "1.0.0-1"
    pullPolicy: IfNotPresent
  frontend:
    repository: ghcr.io/aglelectronics/wiki-frontend
    tag: "1.0.0-1"
    pullPolicy: IfNotPresent
  # One-shot migrator (/migrate). Runs as an initContainer of the backend.
  migrate:
    repository: ghcr.io/aglelectronics/wiki-migrate
    tag: "1.0.0-1"
    pullPolicy: IfNotPresent

# Name of an existing Secret (created by your secret manager, for example an
# ExternalSecret) with the keys DATABASE_URL, S3_ACCESS_KEY_ID,
# S3_SECRET_ACCESS_KEY and WIKI_SERVICE_TOKEN. This chart never creates
# Secrets.
existingSecret: wiki-secrets

# Wiki's access config (roles, permissions, OIDC group bindings).
# Create the ConfigMap from wiki/infra/access-config.toml:
#   kubectl create configmap wiki-access-config -n conservices-wiki \
#     --from-file=access-config.toml=wiki/infra/access-config.toml
accessConfig:
  enabled: true
  existingConfigMap: wiki-access-config
  mountPath: /etc/wiki
  fileName: access-config.toml

# Non-secret settings, rendered into the ConfigMap "<release>-config".
# Every key is documented on the Wiki configuration page.
# ACCESS_CONFIG_PATH is set from accessConfig above.
config:
  APP_ENV: production
  APP_BASE_URL: https://wiki.conservices.test
  HTTP_ADDR: ":8080"
  AUTH_MODE: oidc
  OIDC_ISSUER_URL: https://auth.conservices.test/realms/conservices
  OIDC_CLIENT_ID: wiki-spa
  OIDC_AUDIENCE: wiki-spa
  CORS_ALLOWED_ORIGINS: https://wiki.conservices.test
  S3_ENDPOINT: http://minio.conservices-data.svc.cluster.local:9000
  S3_BUCKET: wiki-data
  S3_REGION: us-east-1
  S3_USE_PATH_STYLE: "true"
  # Must match backend.buffer.mountPath.
  WIKI_BUFFER_DIR: /var/lib/wiki/buffer
  WIKI_OFFBOARD_GRACE_DAYS: "30"
  # Standalone switch for public share links; once paired, Den's
  # wiki_public_links organisation setting wins.
  PUBLIC_LINKS_ENABLED: "false"
  # Pairing URLs carry Den's public address; Wiki swaps in this one.
  # Empty for a standalone install without Den.
  DEN_INTERNAL_URL: http://den-backend.conservices-den.svc.cluster.local:8080

backend:
  # MUST stay 1. Live editing keeps open pages, one-time live tickets and
  # the edit buffer inside the one backend process (ADR 0001). A second
  # replica would split the people editing a page between two relays that
  # never see each other's changes. The chart refuses any other value.
  replicas: 1
  singleReplica: true
  singleReplicaReason: "live editing state and the edit buffer live in one process (wiki ADR 0001)"
  port: 8080
  # Shutdown closes live connections and ships buffered edits to S3; give it
  # at least 30 s (SHUTDOWN_TIMEOUT is 15 s on top).
  terminationGracePeriodSeconds: 45
  # Live edits wait here for up to ~5 s before they are shipped to S3.
  # With persistence off, an emptyDir is used: a clean shutdown still ships
  # everything, but a node crash can lose the last few seconds.
  buffer:
    enabled: true
    mountPath: /var/lib/wiki/buffer
    persistence:
      enabled: true
      size: 1Gi
      storageClassName: ""
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 512Mi }
  # Extra env entries (for example SSL_CERT_DIR for a private CA).
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  hostAliases: []

frontend:
  replicas: 2
  # nginx listens on 8080 (non-root); the image's built-in config uses 80,
  # so the chart mounts its own nginx config from a ConfigMap.
  port: 8080
  # Uploads go through the backend: 25 MB images, 50 MB files, plus overhead.
  clientMaxBodySize: 52m
  # Live editing websockets (kept open while a page is).
  websocketPathRegex: "^/api/v1/pages/[^/]+/live$"
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { cpu: 200m, memory: 64Mi }

ingress:
  enabled: true
  className: nginx
  host: wiki.conservices.test
  # TLS certificate Secret in this namespace (cert-manager or by hand).
  tlsSecretName: conservices-tls
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 52m
    # Live editing websockets stay open for as long as a page is.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"

networkPolicy:
  enabled: true
  # Namespace of the ingress controller (ingress-nginx; kube-system for k3s Traefik).
  ingressControllerNamespace: ingress-nginx
  # The backend reaches the OIDC issuer through the ingress controller on 443
  # (public issuer URL). Turn off and use extraEgress for an external IdP.
  oidcViaIngressController: true
  den:
    enabled: true
    namespace: conservices-den
    port: 8080
  # In-cluster PostgreSQL and MinIO (conservices-data). For managed services
  # set enabled: false and add ipBlock rules to extraEgress.
  data:
    enabled: true
    namespace: conservices-data
    postgresPort: 5432
    s3: true
    s3Port: 9000
  # Other module backends allowed to call Wiki's backend. HR reads
  # GET /api/role-catalog and calls POST /api/internal/offboarded
  # (the offboarding hook, bearer WIKI_SERVICE_TOKEN). HR's namespace needs
  # a matching egress rule.
  allowFromNamespaces:
    - conservices-hr
  keycloakAdmin:
    enabled: false
  # Raw NetworkPolicy egress rules appended to the backend policy, e.g.
  #   - to: [{ ipBlock: { cidr: 10.20.0.0/24 } }]
  #     ports: [{ protocol: TCP, port: 5432 }]
  extraEgress: []
