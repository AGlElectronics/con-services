{{- if .Values.networkPolicy.enabled }}
{{- $ns := .Values.namespace -}}
{{- $np := .Values.networkPolicy -}}
# Deny everything in the namespace, then allow only what the module needs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ $ns }}
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: {{ $ns }}
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: learn-frontend
  namespace: {{ $ns }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: learn
      app.kubernetes.io/component: frontend
  policyTypes: ["Ingress", "Egress"]
  {{- with (include "learn.webIngressFrom" . | trim) }}
  ingress:
    - from:
        {{- . | nindent 8 }}
      ports:
        - { protocol: TCP, port: {{ $.Values.frontend.port }} }
  {{- else }}
  # Cilium's gateway is admitted by the CiliumNetworkPolicy below.
  ingress: []
  {{- end }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: learn
              app.kubernetes.io/component: backend
      ports:
        - { protocol: TCP, port: {{ .Values.backend.port }} }
{{- if ($np.gateway | default dict).cilium }}
---
{{ include "learn.ciliumGatewayPolicy" (dict "root" . "components" (list "frontend")) }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: learn-backend
  namespace: {{ $ns }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: learn
      app.kubernetes.io/component: backend
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: learn
              app.kubernetes.io/component: frontend
        {{- range $np.allowFromNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
          podSelector:
            matchLabels:
              app.kubernetes.io/component: backend
        {{- end }}
      ports:
        - { protocol: TCP, port: {{ .Values.backend.port }} }
  egress:
    {{- with (include "learn.dataEgress" . | trim) }}
    {{- . | nindent 4 }}
    {{- end }}
    {{- if $np.den.enabled }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.den.namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: den
              app.kubernetes.io/component: backend
      ports:
        - { protocol: TCP, port: {{ $np.den.port }} }
    {{- end }}
    {{- with (include "learn.oidcEgress" . | trim) }}
    {{- . | nindent 4 }}
    {{- end }}
    {{- with $np.keycloakAdmin }}
    {{- if .enabled }}
    {{- $sel := .podSelector | default (dict "app" "keycloak") }}
    {{- if ne (printf "%s|%s|%d" .namespace (toJson $sel) (int .port)) (include "learn.oidcKey" $) }}
    # Keycloak admin API, in-cluster. Keycloak's namespace also needs an
    # ingress rule admitting this backend.
    {{- include "learn.egressTo" (dict "namespace" .namespace "podSelector" $sel "port" (int .port)) | nindent 4 }}
    {{- else }}
    # Keycloak admin API: same pods and port as the OIDC rule above.
    {{- end }}
    {{- end }}
    {{- end }}
    {{- $tg := $np.telegram | default dict }}
    {{- if and $tg.enabled $tg.cidrs }}
    # Telegram Bot API (reminders).
    - to:
        {{- range $tg.cidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - { protocol: TCP, port: {{ $tg.port | default 443 }} }
    {{- end }}
    {{- with $np.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- include "learn.externalS3Policy" (dict "root" . "components" (list "backend")) }}
{{- $tg := $np.telegram | default dict }}
{{- if and $tg.enabled $tg.fqdns ($np.gateway | default dict).cilium }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: learn-telegram
  namespace: {{ $ns }}
  labels:
    {{- include "learn.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: learn
      app.kubernetes.io/component: backend
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: ANY }
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        {{- range $tg.fqdns }}
        - matchName: {{ . | quote }}
        {{- end }}
      toPorts:
        - ports:
            - port: {{ $tg.port | default 443 | quote }}
              protocol: TCP
{{- end }}
{{- end }}
