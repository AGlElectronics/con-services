# Learn Helm chart values. STUB (chart version 0.1.0).
# Docs: https://aglelectronics.github.io/con-services/modules/learn/setup/
#
# The namespace is NOT created by this chart. Create it first with the
# labels the platform NetworkPolicies expect (see the setup page):
#   conservices.io/tier: module
#   pod-security.kubernetes.io/enforce: restricted

namespace: conservices-learn

image:
  backend:
    repository: ghcr.io/aglelectronics/learn-backend
    # MAJOR.MINOR.PATCH-BUILD. Never "latest". Use the same tag for all three.
    tag: "1.0.0-1"
    pullPolicy: IfNotPresent
  frontend:
    repository: ghcr.io/aglelectronics/learn-frontend
    tag: "1.0.0-1"
    pullPolicy: IfNotPresent
  # One-shot migrator (/migrate). Runs as an initContainer of the backend.
  migrate:
    repository: ghcr.io/aglelectronics/learn-migrate
    tag: "1.0.0-1"
    pullPolicy: IfNotPresent

# Name of an existing Secret (created by your secret manager, for example an
# ExternalSecret) with the keys DATABASE_URL, S3_ACCESS_KEY_ID,
# S3_SECRET_ACCESS_KEY, KEYCLOAK_CLIENT_SECRET, LEARN_SERVICE_TOKEN, and
# optionally SMTP_PASSWORD and TELEGRAM_BOT_TOKEN. This chart never creates
# Secrets.
existingSecret: learn-secrets

# Learn's access config (roles, permissions, OIDC group bindings).
#   kubectl create configmap learn-access-config -n conservices-learn \
#     --from-file=access-config.toml=learn/infra/access-config.toml
accessConfig:
  enabled: true
  existingConfigMap: learn-access-config
  mountPath: /etc/learn
  fileName: access-config.toml

# Non-secret settings, rendered into the ConfigMap "<release>-config".
# Every key is documented on the Learn configuration page.
config:
  APP_ENV: production
  APP_BASE_URL: https://learn.conservices.test
  HTTP_ADDR: ":8080"
  AUTH_MODE: oidc
  OIDC_ISSUER_URL: https://auth.conservices.test/realms/conservices
  OIDC_CLIENT_ID: learn-spa
  OIDC_AUDIENCE: learn-spa
  # Den's web app calls Learn directly (portal to-dos, my-learning widgets).
  OIDC_EXTRA_AUDIENCES: den-spa
  CORS_ALLOWED_ORIGINS: https://learn.conservices.test,https://den.conservices.test
  # Browser-facing address used in emails, certificates and QR codes.
  PUBLIC_BASE_URL: https://learn.conservices.test
  S3_ENDPOINT: http://minio.conservices-data.svc.cluster.local:9000
  S3_BUCKET: learn-data
  S3_REGION: us-east-1
  S3_USE_PATH_STYLE: "true"
  # Presigned media URLs are rewritten to this browser-reachable address.
  S3_PUBLIC_BASE_URL: https://s3.conservices.test
  SMTP_HOST: ""
  SMTP_PORT: "587"
  SMTP_USERNAME: ""
  SMTP_FROM: no-reply@conservices.test
  SMTP_FROM_NAME: Con Services
  # Read-only Keycloak group lookups (group sync). All four KEYCLOAK_* set
  # (the secret one in existingSecret) = enabled.
  KEYCLOAK_BASE_URL: http://keycloak.conservices-identity.svc.cluster.local:8080
  KEYCLOAK_REALM: conservices
  KEYCLOAK_CLIENT_ID: learn-provisioner
  DEN_INTERNAL_URL: http://den-backend.conservices-den.svc.cluster.local:8080

backend:
  # Learn's background jobs (group sync, reminders) take a PostgreSQL lock,
  # so the app itself can run several replicas. Keep 1 for now anyway: every
  # pod runs the migrate initContainer, and pods starting together would
  # migrate at the same time.
  replicas: 1
  singleReplica: false
  singleReplicaReason: ""
  port: 8080
  terminationGracePeriodSeconds: 30
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  hostAliases: []

frontend:
  replicas: 2
  port: 8080
  clientMaxBodySize: 20m
  websocketPathRegex: ""
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { cpu: 200m, memory: 64Mi }

ingress:
  enabled: true
  className: nginx
  host: learn.conservices.test
  tlsSecretName: conservices-tls
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 20m

networkPolicy:
  enabled: true
  ingressControllerNamespace: ingress-nginx
  oidcViaIngressController: true
  den:
    enabled: true
    namespace: conservices-den
    port: 8080
  data:
    enabled: true
    namespace: conservices-data
    postgresPort: 5432
    s3: true
    s3Port: 9000
  # HR reads GET /api/role-catalog and GET /api/qualification-catalog, and
  # calls GET /api/internal/holdings (bearer LEARN_SERVICE_TOKEN) for
  # training-gated roles. HR's namespace needs a matching egress rule.
  allowFromNamespaces:
    - conservices-hr
  # Group sync calls Keycloak's admin API in-cluster. Keycloak's namespace
  # also needs an ingress rule admitting Learn's backend (platform-owned).
  keycloakAdmin:
    enabled: true
    namespace: conservices-identity
    port: 8080
  # Add your SMTP server here when SMTP_HOST is set, e.g.
  #   - to: [{ ipBlock: { cidr: 203.0.113.10/32 } }]
  #     ports: [{ protocol: TCP, port: 587 }]
  extraEgress: []
