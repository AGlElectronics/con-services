# Desk Helm chart values. STUB (chart version 0.1.0).
# Docs: https://aglelectronics.github.io/con-services/modules/desk/setup/
#
# The namespace is NOT created by this chart. Create it first with the
# labels the platform NetworkPolicies expect (see the setup page):
#   conservices.io/tier: module
#   pod-security.kubernetes.io/enforce: restricted

namespace: conservices-desk

image:
  backend:
    repository: ghcr.io/aglelectronics/desk-backend
    # MAJOR.MINOR.PATCH-BUILD. Never "latest". Use the same tag for all three.
    tag: "1.0.0-1"
    pullPolicy: IfNotPresent
  frontend:
    repository: ghcr.io/aglelectronics/desk-frontend
    tag: "1.0.0-1"
    pullPolicy: IfNotPresent
  # One-shot migrator (/migrate). Runs as an initContainer of the backend.
  migrate:
    repository: ghcr.io/aglelectronics/desk-migrate
    tag: "1.0.0-1"
    pullPolicy: IfNotPresent

# Name of an existing Secret (created by your secret manager, for example an
# ExternalSecret) with the keys DATABASE_URL and DESK_SECRET_KEY, plus
# SMTP_PASSWORD if the fallback SMTP server needs one. This chart never
# creates Secrets.
existingSecret: desk-secrets

# Desk's access config (roles, permissions, OIDC group bindings).
#   kubectl create configmap desk-access-config -n conservices-desk \
#     --from-file=access-config.toml=desk/infra/access-config.toml
accessConfig:
  enabled: true
  existingConfigMap: desk-access-config
  mountPath: /etc/desk
  fileName: access-config.toml

# Non-secret settings, rendered into the ConfigMap "<release>-config".
# Every key is documented on the Desk configuration page.
config:
  APP_ENV: production
  APP_BASE_URL: https://desk.conservices.test
  HTTP_ADDR: ":8080"
  AUTH_MODE: oidc
  OIDC_ISSUER_URL: https://auth.conservices.test/realms/conservices
  OIDC_CLIENT_ID: desk-spa
  OIDC_AUDIENCE: desk-spa
  CORS_ALLOWED_ORIGINS: https://desk.conservices.test
  # How often every mailbox is polled over IMAP.
  FETCH_INTERVAL: 60s
  # Fallback outbound mail for mailboxes without their own SMTP server.
  # Empty SMTP_HOST: such mailboxes cannot send.
  SMTP_HOST: ""
  SMTP_PORT: "587"
  SMTP_SECURITY: starttls
  SMTP_USERNAME: ""
  DEN_INTERNAL_URL: http://den-backend.conservices-den.svc.cluster.local:8080

backend:
  # MUST stay 1. The IMAP fetcher and the reply sender run inside the
  # backend and assume no other pod polls the same mailboxes or sends the
  # same queued replies. The chart refuses any other value.
  replicas: 1
  singleReplica: true
  singleReplicaReason: "the IMAP fetcher and reply sender assume one process (desk docs/plan.md)"
  port: 8080
  terminationGracePeriodSeconds: 30
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  hostAliases: []

frontend:
  replicas: 2
  port: 8080
  clientMaxBodySize: 20m
  websocketPathRegex: ""
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { cpu: 200m, memory: 64Mi }

ingress:
  enabled: true
  className: nginx
  host: desk.conservices.test
  tlsSecretName: conservices-tls
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 20m

networkPolicy:
  enabled: true
  ingressControllerNamespace: ingress-nginx
  oidcViaIngressController: true
  den:
    enabled: true
    namespace: conservices-den
    port: 8080
  # Desk stores everything (including attachments) in PostgreSQL; it has no
  # bucket, so s3 is off.
  data:
    enabled: true
    namespace: conservices-data
    postgresPort: 5432
    s3: false
    s3Port: 9000
  # HR reads GET /api/role-catalog.
  allowFromNamespaces:
    - conservices-hr
  keycloakAdmin:
    enabled: false
  # Desk must reach your mail servers: IMAP (993, or 143 with STARTTLS) for
  # every mailbox and SMTP (465 or 587). Nothing works without these rules.
  # Narrow the CIDR to your mail provider's addresses where you can.
  extraEgress:
    - to: [{ ipBlock: { cidr: 0.0.0.0/0 } }]
      ports:
        - { protocol: TCP, port: 993 }
        - { protocol: TCP, port: 143 }
        - { protocol: TCP, port: 465 }
        - { protocol: TCP, port: 587 }
