{{- $tls := .Values.internalTLS.enabled -}}
{{- $scheme := include "desk.scheme" . -}}
apiVersion: v1
kind: Service
metadata:
  name: desk-backend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "desk.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  selector:
    app.kubernetes.io/name: desk
    app.kubernetes.io/component: backend
  ports:
    - name: {{ $scheme }}
      port: {{ .Values.backend.port }}
      targetPort: {{ $scheme }}
---
apiVersion: v1
kind: Service
metadata:
  name: desk-frontend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "desk.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  selector:
    app.kubernetes.io/name: desk
    app.kubernetes.io/component: frontend
  ports:
    - name: {{ $scheme }}
      port: {{ if $tls }}443{{ else }}80{{ end }}
      targetPort: {{ $scheme }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: desk
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "desk.labels" . | nindent 4 }}
  {{- if or .Values.ingress.annotations (and $tls .Values.internalTLS.ingressNginxAnnotations) }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if and $tls .Values.internalTLS.ingressNginxAnnotations }}
    # The controller talks HTTPS to the web app and checks its certificate
    # against the ca.crt in desk-frontend-tls.
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
    nginx.ingress.kubernetes.io/proxy-ssl-secret: {{ .Values.namespace }}/desk-frontend-tls
    nginx.ingress.kubernetes.io/proxy-ssl-verify: "on"
    nginx.ingress.kubernetes.io/proxy-ssl-name: desk-frontend.{{ .Values.namespace }}.svc.cluster.local
    nginx.ingress.kubernetes.io/proxy-ssl-server-name: "on"
    {{- end }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tlsSecretName }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tlsSecretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: desk-frontend
                port:
                  name: {{ $scheme }}
{{- end }}
