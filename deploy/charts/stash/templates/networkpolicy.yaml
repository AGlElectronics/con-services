{{- if .Values.networkPolicy.enabled }}
{{- $ns := .Values.namespace -}}
{{- $np := .Values.networkPolicy -}}
# Deny everything in the namespace, then allow only what the module needs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ $ns }}
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: {{ $ns }}
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: stash-frontend
  namespace: {{ $ns }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: stash
      app.kubernetes.io/component: frontend
  policyTypes: ["Ingress", "Egress"]
  {{- with (include "stash.webIngressFrom" . | trim) }}
  ingress:
    - from:
        {{- . | nindent 8 }}
      ports:
        - { protocol: TCP, port: {{ $.Values.frontend.port }} }
  {{- else }}
  # Cilium's gateway is admitted by the CiliumNetworkPolicy below.
  ingress: []
  {{- end }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: stash
              app.kubernetes.io/component: backend
      ports:
        - { protocol: TCP, port: {{ .Values.backend.port }} }
{{- if ($np.gateway | default dict).cilium }}
---
{{ include "stash.ciliumGatewayPolicy" (dict "root" . "components" (list "frontend")) }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: stash-backend
  namespace: {{ $ns }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: stash
      app.kubernetes.io/component: backend
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: stash
              app.kubernetes.io/component: frontend
        {{- range $np.allowFromNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
          podSelector:
            matchLabels:
              app.kubernetes.io/component: backend
        {{- end }}
        {{- if $np.den.enabled }}
        # Den's backend reads GET /api/role-catalog and GET /api/portal/todos.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.den.namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: den
              app.kubernetes.io/component: backend
        {{- end }}
      ports:
        - { protocol: TCP, port: {{ .Values.backend.port }} }
  egress:
    {{- with (include "stash.dataEgress" . | trim) }}
    {{- . | nindent 4 }}
    {{- end }}
    {{- if $np.den.enabled }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.den.namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: den
              app.kubernetes.io/component: backend
      ports:
        - { protocol: TCP, port: {{ $np.den.port }} }
    {{- end }}
    {{- with (include "stash.oidcEgress" . | trim) }}
    {{- . | nindent 4 }}
    {{- end }}
    {{- $cilium := ($np.gateway | default dict).cilium }}
    {{- range $svc := list ($np.telegram | default dict) ($np.smtp | default dict) }}
    {{- if and $svc.enabled (not $cilium) $svc.cidrs }}
    # External service by address range ({{ if $svc.port }}Telegram{{ else }}SMTP{{ end }}).
    - to:
        {{- range $svc.cidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        {{- range (ternary (list $svc.port) $svc.ports (hasKey $svc "port")) }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
    {{- end }}
    {{- end }}
    {{- with $np.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- include "stash.externalS3Policy" (dict "root" . "components" (list "backend")) }}
{{- $tg := $np.telegram | default dict }}
{{- $smtp := $np.smtp | default dict }}
{{- if and ($np.gateway | default dict).cilium (or (and $tg.enabled $tg.fqdns) (and $smtp.enabled $smtp.fqdns)) }}
---
# Telegram Bot API and the SMTP server by host name (Cilium toFQDNs).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: stash-backend-external
  namespace: {{ $ns }}
  labels:
    {{- include "stash.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: stash
      app.kubernetes.io/component: backend
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: ANY }
          rules:
            dns:
              - matchPattern: "*"
    {{- if and $tg.enabled $tg.fqdns }}
    - toFQDNs:
        {{- range $tg.fqdns }}
        - matchName: {{ . | quote }}
        {{- end }}
      toPorts:
        - ports:
            - { port: {{ $tg.port | default 443 | quote }}, protocol: TCP }
    {{- end }}
    {{- if and $smtp.enabled $smtp.fqdns }}
    - toFQDNs:
        {{- range $smtp.fqdns }}
        - matchName: {{ . | quote }}
        {{- end }}
      toPorts:
        - ports:
            {{- range $smtp.ports }}
            - { port: {{ . | quote }}, protocol: TCP }
            {{- end }}
    {{- end }}
{{- end }}
{{- end }}
