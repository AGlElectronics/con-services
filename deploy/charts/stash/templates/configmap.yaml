apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "stash.labels" . | nindent 4 }}
data:
  {{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  ACCESS_CONFIG_PATH: {{ printf "%s/%s" .Values.accessConfig.mountPath .Values.accessConfig.fileName | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-frontend-nginx
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "stash.labels" . | nindent 4 }}
data:
  default.conf: |
    upstream stash_backend {
        server stash-backend.{{ .Values.namespace }}.svc.cluster.local:{{ .Values.backend.port }};
    }
    server {
        listen {{ .Values.frontend.port }};
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 50m;
        gzip on;
        gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml;
        gzip_min_length 1024;
        location /api/ {
            proxy_pass http://stash_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_buffering off;
        }
        location = /sw.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            try_files $uri =404;
        }
        location = /manifest.webmanifest {
            add_header Cache-Control "no-cache" always;
            types {} default_type "application/manifest+json";
            try_files $uri =404;
        }
        location = /brand.json {
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
        }
        location /static/ {
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            try_files $uri =404;
        }
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache" always;
            add_header Permissions-Policy "camera=(self)" always;
        }
    }
