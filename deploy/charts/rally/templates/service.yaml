{{- $ns := .Values.namespace -}}
{{- $tls := .Values.internalTLS.enabled -}}
{{- $scheme := include "rally.scheme" . -}}
apiVersion: v1
kind: Service
metadata:
  name: rally-backend
  namespace: {{ $ns }}
  labels:
    {{- include "rally.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  selector:
    app.kubernetes.io/name: rally
    app.kubernetes.io/component: backend
  ports:
    - name: {{ $scheme }}
      port: {{ .Values.backend.port }}
      targetPort: {{ $scheme }}
---
apiVersion: v1
kind: Service
metadata:
  name: rally-frontend
  namespace: {{ $ns }}
  labels:
    {{- include "rally.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  selector:
    app.kubernetes.io/name: rally
    app.kubernetes.io/component: frontend
  ports:
    - name: {{ $scheme }}
      port: {{ if $tls }}443{{ else }}80{{ end }}
      targetPort: {{ $scheme }}
{{- if .Values.submit.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: rally-submit
  namespace: {{ $ns }}
  labels:
    {{- include "rally.labels" . | nindent 4 }}
    app.kubernetes.io/component: submit
spec:
  selector:
    app.kubernetes.io/name: rally
    app.kubernetes.io/component: submit
  ports:
    - name: {{ $scheme }}
      port: {{ if $tls }}443{{ else }}80{{ end }}
      targetPort: {{ $scheme }}
{{- end }}
{{- if .Values.ingress.enabled }}
{{- /* One Ingress per host: ingress-nginx's proxy-ssl-* annotations apply to
the whole Ingress, and each web app has its own certificate. */}}
---
{{ include "rally.ingress" (dict "root" . "name" "rally" "host" .Values.ingress.host "service" "rally-frontend") }}
{{- if .Values.submit.enabled }}
---
{{ include "rally.ingress" (dict "root" . "name" "rally-submit" "host" .Values.submit.host "service" "rally-submit") }}
{{- end }}
{{- end }}
