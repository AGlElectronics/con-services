{{- $tls := .Values.internalTLS.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "rally.labels" . | nindent 4 }}
data:
  {{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  DEN_MODE: {{ include "rally.denMode" . | quote }}
  ACCESS_CONFIG_PATH: {{ printf "%s/%s" .Values.accessConfig.mountPath .Values.accessConfig.fileName | quote }}
  {{- if $tls }}
  TLS_CERT_FILE: /etc/conservices-tls/tls.crt
  TLS_KEY_FILE: /etc/conservices-tls/tls.key
  {{- if not (hasKey .Values.config "SSL_CERT_DIR") }}
  SSL_CERT_DIR: /etc/conservices-internal-ca
  {{- end }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-frontend-nginx
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "rally.labels" . | nindent 4 }}
data:
  default.conf: |
    {{- include "rally.nginx" . | nindent 4 }}
  {{- if $tls }}
  # Started by the nginx image's entrypoint. nginx reads its certificate
  # only at start and on reload; reload every six hours to pick up a
  # certificate renewed by cert-manager.
  90-reload-tls.sh: |
    #!/bin/sh
    (
      while sleep 21600; do
        nginx -s reload
      done
    ) &
  {{- end }}
