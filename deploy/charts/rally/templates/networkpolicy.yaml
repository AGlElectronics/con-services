{{- if .Values.networkPolicy.enabled }}
{{- $ns := .Values.namespace -}}
{{- $np := .Values.networkPolicy -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ $ns }}
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: {{ $ns }}
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# Staff app and submission site: gateway or ingress controller in, backend out.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rally-web
  namespace: {{ $ns }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rally
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: ["frontend", "submit"]
  policyTypes: ["Ingress", "Egress"]
  {{- with (include "rally.webIngressFrom" . | trim) }}
  ingress:
    - from:
        {{- . | nindent 8 }}
      ports:
        - { protocol: TCP, port: {{ $.Values.frontend.port }} }
  {{- else }}
  # Cilium's gateway is admitted by the CiliumNetworkPolicy below.
  ingress: []
  {{- end }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: rally
              app.kubernetes.io/component: backend
      ports:
        - { protocol: TCP, port: {{ .Values.backend.port }} }
{{- if ($np.gateway | default dict).cilium }}
---
{{ include "rally.ciliumGatewayPolicy" (dict "root" . "components" (list "frontend" "submit")) }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rally-backend
  namespace: {{ $ns }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rally
      app.kubernetes.io/component: backend
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: rally
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: ["frontend", "submit"]
        {{- range $np.allowFromNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
          podSelector:
            matchLabels:
              app.kubernetes.io/component: backend
        {{- end }}
      ports:
        - { protocol: TCP, port: {{ .Values.backend.port }} }
  egress:
    {{- with (include "rally.dataEgress" . | trim) }}
    {{- . | nindent 4 }}
    {{- end }}
    {{- if $np.den.enabled }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.den.namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: den
              app.kubernetes.io/component: backend
      ports:
        - { protocol: TCP, port: {{ $np.den.port }} }
    {{- end }}
    {{- /* OIDC discovery for both realms (staff and attendees). */}}
    {{- with (include "rally.oidcEgress" . | trim) }}
    {{- . | nindent 4 }}
    {{- end }}
    {{- with $np.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- include "rally.externalS3Policy" (dict "root" . "components" (list "backend")) }}
{{- end }}
