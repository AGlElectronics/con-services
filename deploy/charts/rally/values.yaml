# Rally Helm chart values. STUB (chart version 0.1.0).
# Docs: https://aglelectronics.github.io/con-services/modules/rally/setup/
#
# The namespace is NOT created by this chart. Create it first with the
# labels the platform NetworkPolicies expect (see the setup page):
#   conservices.io/tier: module
#   pod-security.kubernetes.io/enforce: restricted
#
# Rally pairs with Den under the slug "events" (Den's built-in name for it),
# and its Keycloak client and groups are events-spa / events-*.

namespace: conservices-rally

image:
  backend:
    repository: ghcr.io/aglelectronics/rally-backend
    # MAJOR.MINOR.PATCH-BUILD. Required; no Rally release is published yet.
    tag: ""
    pullPolicy: IfNotPresent
  frontend:
    repository: ghcr.io/aglelectronics/rally-frontend
    tag: ""
    pullPolicy: IfNotPresent
  # One-shot migrator (/migrate). Runs as an initContainer of the backend.
  migrate:
    repository: ghcr.io/aglelectronics/rally-migrate
    tag: ""
    pullPolicy: IfNotPresent

# Existing Secret (from your secret manager). Keys Rally reads from it:
#   DATABASE_URL                               required
#   S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY     required while S3_ENABLED=true
#   TELEGRAM_BOT_TOKEN                         optional (empty = dry-run announcements)
# This chart never creates Secrets.
existingSecret: rally-secrets

# Access config (roles, permissions, OIDC group bindings). Create it from
# Rally/infra/access-config.toml:
#   kubectl create configmap rally-access-config -n conservices-rally \
#     --from-file=access-config.toml=Rally/infra/access-config.toml
accessConfig:
  existingConfigMap: rally-access-config
  mountPath: /etc/rally
  fileName: access-config.toml

# Non-secret settings -> ConfigMap "<release>-config". Documented on the
# Rally configuration page. ACCESS_CONFIG_PATH is set from accessConfig.
config:
  APP_ENV: production
  APP_BASE_URL: https://events.conservices.test
  HTTP_ADDR: ":8080"
  AUTH_MODE: oidc
  OIDC_ISSUER_URL: https://auth.conservices.test/realms/conservices
  OIDC_CLIENT_ID: events-spa
  OIDC_AUDIENCE: events-spa
  # Attendee realm for the public submission site (must differ from staff).
  ATTENDEE_OIDC_ISSUER_URL: https://auth.conservices.test/realms/attendees
  ATTENDEE_OIDC_CLIENT_ID: rally-submit
  CORS_ALLOWED_ORIGINS: https://events.conservices.test,https://submit.conservices.test
  S3_ENABLED: "true"
  S3_ENDPOINT: http://minio.conservices-data.svc.cluster.local:9000
  S3_BUCKET: events-data
  S3_REGION: us-east-1
  S3_USE_PATH_STYLE: "true"
  # Browsers upload and download straight from S3 with presigned URLs, so
  # this must be an address browsers can reach (CHANGE ME).
  S3_PUBLIC_BASE_URL: https://s3.conservices.test
  PUBLIC_SCHEDULE_ENABLED: "false"
  # Not a secret: compiled into the submission site. Change to rotate.
  PUBLIC_API_BUILTIN_KEY: change-me
  DEN_INTERNAL_URL: http://den-backend.conservices-den.svc.cluster.local:8080

backend:
  # 1 replica with Recreate so the migrate initContainer never runs next to
  # an older backend. Raise once rolling migrations are tested.
  replicas: 1
  port: 8080
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  hostAliases: []

frontend:
  replicas: 2
  # nginx listens on 8080 (non-root); the chart mounts its own nginx config.
  port: 8080
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { cpu: 200m, memory: 64Mi }

# Public submission site: the same frontend source built with
# RALLY_APP=submit. No image is published for it yet; build it yourself
# (see the Rally setup page) and set repository and tag.
submit:
  enabled: false
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 2
  host: submit.conservices.test

ingress:
  enabled: true
  className: nginx
  host: events.conservices.test
  tlsSecretName: conservices-tls
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 50m

networkPolicy:
  enabled: true
  ingressControllerNamespace: ingress-nginx
  oidcViaIngressController: true
  den:
    enabled: true
    namespace: conservices-den
    port: 8080
  data:
    enabled: true
    namespace: conservices-data
    postgresPort: 5432
    s3Port: 9000
  # Module backends allowed to call Rally's backend (HR reads
  # GET /api/role-catalog).
  allowFromNamespaces:
    - conservices-hr
  # Telegram (api.telegram.org) is on the internet; standard policies cannot
  # match host names. Add a rule here if you send announcements, e.g.
  #   - to: [{ ipBlock: { cidr: 0.0.0.0/0 } }]
  #     ports: [{ protocol: TCP, port: 443 }]
  extraEgress: []
